name: Fix memory print freeze

on:
  push:
    branches: [main]
    paths:
      - 'tools/fix_memory_print.mjs'
      - '.github/workflows/fix-memory-print.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-and-test:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.55.0-noble
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - name: Apply memory print fix
        run: node tools/fix_memory_print.mjs
      - name: Run vocabulary audits
        run: |
          node tools/extract_vocab_data.mjs
          python3 tools/audit_vocab_structure.py
          node tools/diagnose_exam_pos.mjs
      - name: Install matching Playwright package only
        run: npm install --no-save playwright@1.55.0
      - name: Test memory print guard and pagination in Chromium
        run: |
          python3 -m http.server 8765 >/tmp/http.log 2>&1 &
          node - <<'NODE'
          const { chromium } = require('playwright');
          (async()=>{
            const browser = await chromium.launch();
            const page = await browser.newPage({viewport:{width:1365,height:768}});
            await page.goto('http://127.0.0.1:8765/',{waitUntil:'domcontentloaded'});
            await page.locator('.title',{hasText:'英単語アプリ（統合版）'}).waitFor();
            await page.evaluate(()=>{
              window.__alerts=[];
              window.__printCalled=0;
              window.alert=(m)=>window.__alerts.push(String(m));
              window.print=()=>{window.__printCalled++};
            });

            const t0=Date.now();
            await page.locator('#memoryPrintBtn').click();
            await page.waitForTimeout(100);
            const guard=await page.evaluate(()=>({alerts:window.__alerts.slice(),prints:window.__printCalled}));
            const elapsed=Date.now()-t0;
            if(elapsed>2500) throw new Error('large-selection guard too slow: '+elapsed+'ms');
            if(guard.prints!==0) throw new Error('large selection unexpectedly invoked print');
            if(!guard.alerts.some(x=>x.includes('300 語以下'))) throw new Error('large selection safety message missing: '+JSON.stringify(guard));

            await page.evaluate(()=>{
              state.currentList = DATA.filter(r=>r.dataset==='textbook').slice(0,45);
              window.__alerts=[];
              window.__printCalled=0;
            });
            await page.locator('#memoryPrintBtn').click();
            await page.waitForFunction(()=>window.__printCalled===1,null,{timeout:10000});
            const result=await page.evaluate(()=>({
              pages:document.querySelectorAll('#printSheet .rb-memory-page').length,
              rows:[...document.querySelectorAll('#printSheet .rb-memory-page')].map(p=>p.querySelectorAll('.rb-mem-row').length),
              prints:window.__printCalled,
              alerts:window.__alerts.slice()
            }));
            if(result.pages!==3) throw new Error('45 rows should create 3 pages: '+JSON.stringify(result));
            if(result.rows.some(n=>n>18) || result.rows.reduce((a,b)=>a+b,0)!==45) throw new Error('pagination row counts invalid: '+JSON.stringify(result));
            if(result.prints!==1) throw new Error('print not invoked exactly once');

            await page.locator('button.tab[data-dataset="elementary"]').click();
            await page.evaluate(()=>{
              state.currentList = DATA.filter(r=>r.dataset==='elementary').slice(0,20);
              window.__printCalled=0;
            });
            await page.locator('#memoryPrintBtn').click();
            await page.waitForFunction(()=>window.__printCalled===1,null,{timeout:10000});
            const elemHeading=await page.locator('#printSheet .rb-memory-group h3').first().textContent();
            if(!elemHeading || elemHeading.trim()==='その他') throw new Error('elementary memory group heading still broken: '+elemHeading);

            console.log(JSON.stringify({status:'pass',large_guard_ms:elapsed,guard_alert:guard.alerts[0],textbook_45:{pages:result.pages,rows:result.rows},elementary_heading:elemHeading},null,2));
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
      - name: Commit fixed app
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --rebase --autostash origin main
          git add index.html audit/EXAM_POS_DIAGNOSTIC.json audit/VOCAB_EMBEDDED_DATA_SUMMARY.json audit/VOCAB_EMBEDDED_DATA_SUMMARY.txt audit/VOCAB_SECONDARY_AUDIT.json audit/VOCAB_SECONDARY_AUDIT.txt
          git diff --cached --quiet && exit 0
          git commit -m 'fix: prevent memory print freeze and paginate output'
          git push origin HEAD:main
