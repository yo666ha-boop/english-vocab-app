name: Audit min20 target samples
on:
  push:
    branches: [fix-vocab-grammar-range-20260825]
    paths:
      - tools/audit_min20_target_samples.mjs
      - .github/workflows/audit-min20-target-samples.yml
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-vocab-grammar-range-20260825
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: git fetch origin fix-vocab-grammar-range-20260825 && git reset --hard origin/fix-vocab-grammar-range-20260825
      - run: node tools/audit_min20_target_samples.mjs
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add audit/PROBLEM_APP_MIN20_TARGET_SAMPLES.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'audit: record min20 target samples [skip ci]'
          git pull --rebase origin fix-vocab-grammar-range-20260825
          git push
