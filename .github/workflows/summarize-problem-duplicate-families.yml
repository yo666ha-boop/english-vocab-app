name: Summarize problem duplicate families

on:
  workflow_dispatch:
  push:
    branches:
      - fix-problem-content-quality-20260828
    paths:
      - 'tools/summarize_problem_duplicate_families.mjs'
      - '.github/workflows/summarize-problem-duplicate-families.yml'

permissions:
  contents: write

jobs:
  summarize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-problem-content-quality-20260828
          fetch-depth: 0
      - run: |
          git fetch origin fix-problem-content-quality-20260828
          git reset --hard origin/fix-problem-content-quality-20260828
      - run: node tools/summarize_problem_duplicate_families.mjs
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add audit/PROBLEM_APP_DUPLICATE_FAMILY_SUMMARY.json
          if ! git diff --cached --quiet; then
            git commit -m 'audit: record duplicate problem families [skip ci]'
            git pull --rebase origin fix-problem-content-quality-20260828
            git push origin HEAD:fix-problem-content-quality-20260828
          fi
