name: Audit vocab zeroed rows

on:
  push:
    branches:
      - fix-vocab-grammar-range-20260825
    paths:
      - tools/audit_vocab_zeroed_rows.mjs
      - .github/workflows/audit-vocab-zeroed-rows.yml
      - audit/PROBLEM_APP_VOCAB_ZEROED_TRIGGER.md

permissions:
  contents: write

concurrency:
  group: audit-vocab-zeroed-${{ github.ref }}
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-vocab-grammar-range-20260825
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Sync branch
        run: |
          git fetch origin fix-vocab-grammar-range-20260825
          git reset --hard origin/fix-vocab-grammar-range-20260825
      - name: Audit learned-only zeroed rows
        run: node tools/audit_vocab_zeroed_rows.mjs
      - name: Commit audit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add audit/PROBLEM_APP_VOCAB_ZEROED_ROWS.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'audit: record learned-only vocab zeroed rows [skip ci]'
          git pull --rebase origin fix-vocab-grammar-range-20260825
          git push
