name: Package Mikami Repair

on:
  push:
    branches: [mikami-canonical-repair]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build repair package
        run: |
          mkdir -p dist/mikami-repair/tools dist/mikami-repair/data
          cp tools/*.mjs dist/mikami-repair/tools/
          cp data/*.json dist/mikami-repair/data/
          cat > dist/mikami-repair/README.txt <<'EOF'
          みかみ塾英語問題アプリ 正本修正ツール
          対象: 14b01a93-de5d-4c95-a655-932d2f3f2513.html
          実行: node tools/run_mikami_pipeline_v3.mjs <正本.html> <修正版.html>
          内容: 問題バンク修正 / 中3復習V4 / 前提文法ゲート / 品質ゲート / v7単語座標 / 0,-1遮断
          EOF
          cd dist
          zip -r mikami-repair-tools-20260818.zip mikami-repair
      - name: Upload repair package
        uses: actions/upload-artifact@v4
        with:
          name: mikami-repair-tools-20260818
          path: dist/mikami-repair-tools-20260818.zip
          if-no-files-found: error
