name: Repair vocab-safe fallback v1

on:
  push:
    branches:
      - fix-vocab-grammar-range-20260825
    paths:
      - tools/repair_vocab_safe_fallback_v1.mjs
      - .github/workflows/repair-vocab-safe-fallback-v1.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Repair injected runtime and installer source
        run: node tools/repair_vocab_safe_fallback_v1.mjs
      - name: Parse-check repaired runtime
        run: |
          node tools/check_problem_app_runtime_parse.mjs
          node -e "const x=require('./audit/PROBLEM_APP_RUNTIME_PARSE_CHECK.json'); if(x.nodeCheckStatus!==0||!x.newFunctionParse) process.exit(1);"
      - name: Commit repaired candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add problem-app/index.html tools/install_vocab_safe_fallback_v1.mjs audit/VOCAB_SAFE_FALLBACK_SYNTAX_REPAIR.json audit/PROBLEM_APP_RUNTIME_PARSE_CHECK.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'fix: make vocab fallback allowance supplemental [skip ci]'
          branch="${GITHUB_REF_NAME}"
          for attempt in 1 2 3 4; do
            git fetch origin "${branch}"
            if ! git rebase "origin/${branch}"; then git rebase --abort || true; exit 1; fi
            if git push origin "HEAD:${branch}"; then exit 0; fi
            sleep 2
          done
          exit 1
