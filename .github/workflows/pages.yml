name: Deploy vocabulary app to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Prepare static site
        run: |
          mkdir -p _site
          cp index.html _site/index.html
          touch _site/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify live Pages matches main index
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          PAGE_URL='${{ steps.deployment.outputs.page_url }}'
          EXPECTED_SHA="$(sha256sum index.html | awk '{print $1}')"
          LIVE_SHA=''
          for i in $(seq 1 12); do
            if curl -LfsS --connect-timeout 10 --max-time 30 "${PAGE_URL}" -o /tmp/live-index.html; then
              LIVE_SHA="$(sha256sum /tmp/live-index.html | awk '{print $1}')"
              if [ "$LIVE_SHA" = "$EXPECTED_SHA" ]; then
                break
              fi
            fi
            sleep 5
          done
          test "$LIVE_SHA" = "$EXPECTED_SHA"
          grep -q '英単語アプリ（統合版）' /tmp/live-index.html
          grep -q 'id="makeTestBtn"' /tmp/live-index.html
          grep -q 'テスト作成' /tmp/live-index.html
          echo "page_url=$PAGE_URL" >> "$GITHUB_OUTPUT"
          echo "index_sha256=$EXPECTED_SHA" >> "$GITHUB_OUTPUT"

      - name: Record verified Pages URL
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p audit
          PAGE_URL='${{ steps.verify.outputs.page_url }}'
          INDEX_SHA='${{ steps.verify.outputs.index_sha256 }}'
          VERIFIED_AT="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          cat > audit/PAGES_DEPLOY_STATUS.json <<EOF
          {
            "status": "verified",
            "page_url": "$PAGE_URL",
            "index_sha256": "$INDEX_SHA",
            "verified_at_utc": "$VERIFIED_AT",
            "checks": {
              "http_fetch": true,
              "live_matches_main_index_sha256": true,
              "app_title_present": true,
              "make_test_button_present": true
            }
          }
          EOF
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add audit/PAGES_DEPLOY_STATUS.json
          if git diff --cached --quiet; then
            echo 'Pages status unchanged'
          else
            git commit -m 'chore: record verified GitHub Pages deployment'
            git push origin HEAD:main
          fi
