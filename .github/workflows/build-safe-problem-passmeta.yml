name: Build safe problem passMeta

on:
  push:
    branches:
      - fix-vocab-grammar-range-20260825
    paths:
      - tools/build_safe_problem_passmeta.mjs
      - .github/workflows/build-safe-problem-passmeta.yml
      - audit/PROBLEM_APP_PASSMETA_SAFE_TRIGGER.md

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build conservative canonical passMeta
        run: node tools/build_safe_problem_passmeta.mjs
      - name: Commit audit and candidate
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add audit/PROBLEM_APP_PASSMETA_SAFE_AUDIT.json audit/PROBLEM_APP_PASSMETA_SAFE_CANDIDATE.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'test: record conservative vocab passMeta candidate [skip ci]'
          git push
