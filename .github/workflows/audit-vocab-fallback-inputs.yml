name: Audit vocab fallback inputs

on:
  push:
    branches:
      - fix-vocab-grammar-range-20260825
    paths:
      - tools/audit_vocab_fallback_inputs.mjs
      - .github/workflows/audit-vocab-fallback-inputs.yml

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Audit elementary source and severe fallback inputs
        run: node tools/audit_vocab_fallback_inputs.mjs
      - name: Commit result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add audit/VOCAB_FALLBACK_INPUT_AUDIT.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'audit: record vocab fallback input gaps [skip ci]'
          branch="${GITHUB_REF_NAME}"
          for attempt in 1 2 3 4; do
            git fetch origin "${branch}"
            if ! git rebase "origin/${branch}"; then git rebase --abort || true; exit 1; fi
            if git push origin "HEAD:${branch}"; then exit 0; fi
            sleep 2
          done
          exit 1
