name: Textbook page filter task

on:
  push:
    branches: [main]
    paths:
      - 'tools/page_filter_task.mjs'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-task:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run page filter task
        run: node tools/page_filter_task.mjs
      - name: Commit generated changes
        run: |
          if git diff --quiet && git diff --cached --quiet; then
            echo 'No generated changes.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html tools/sync_vocab_v7.mjs audit/PAGE_FILTER_CONTEXT.txt audit/PAGE_FILTER_RESULT.json 2>/dev/null || true
          git commit -m 'feat: apply textbook page range filter'
          git push
