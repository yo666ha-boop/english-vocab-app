name: Repair content semantic residuals

on:
  workflow_dispatch:
  push:
    branches:
      - fix-problem-content-quality-20260828
    paths:
      - 'tools/repair_content_semantic_residuals.mjs'
      - '.github/workflows/repair-content-semantic-residuals.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-problem-content-quality-20260828
      - name: Repair semantic residuals
        run: node tools/repair_content_semantic_residuals.mjs
      - name: Validate embedded bank
        run: |
          node --check tools/repair_content_semantic_residuals.mjs
          node - <<'NODE'
          const fs=require('fs');const h=fs.readFileSync('problem-app/index.html','utf8');const m=/<script\s+id=["']qb-data["'][^>]*>([\s\S]*?)<\/script>/i.exec(h);if(!m)throw Error('qb-data');const a=JSON.parse(m[1]);const e=a.filter(x=>x&&x.subject==='英語');if(e.length!==10511)throw Error('english count '+e.length);if(new Set(e.map(x=>x.id)).size!==10511)throw Error('duplicate ids');
          NODE
      - name: Commit repaired bank
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add problem-app/index.html audit/PROBLEM_APP_SEMANTIC_RESIDUAL_REPAIR.json
          if git diff --cached --quiet; then
            echo 'No repair change'
          else
            git commit -m 'fix: repair residual semantic template errors [skip ci]'
            git push
          fi
