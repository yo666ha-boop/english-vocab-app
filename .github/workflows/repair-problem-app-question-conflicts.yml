name: Repair problem app question conflicts

on:
  push:
    branches:
      - fix-vocab-grammar-range-20260825
    paths:
      - tools/repair_problem_app_question_answer_conflicts.mjs
      - .github/workflows/repair-problem-app-question-conflicts.yml

permissions:
  contents: write

concurrency:
  group: repair-problem-app-question-conflicts-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Sync branch
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "${GITHUB_REF_NAME}"
          git rebase "origin/${GITHUB_REF_NAME}"
      - name: Repair generic conflict templates
        shell: bash
        run: |
          set +e
          node tools/repair_problem_app_question_answer_conflicts.mjs
          code=$?
          set -e
          if [ "$code" -ne 0 ] && [ "$code" -ne 2 ]; then exit "$code"; fi
          echo "REPAIR_REVIEW_CODE=$code" >> "$GITHUB_ENV"
      - name: Validate runtime syntax
        run: node tools/check_problem_app_runtime_parse.mjs
      - name: Commit repair and audit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add problem-app/index.html audit/PROBLEM_APP_QUESTION_CONFLICT_REPAIR.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'fix: repair generic problem-answer conflicts [skip ci]'
          branch="${GITHUB_REF_NAME}"
          for attempt in 1 2 3 4; do
            if git push origin "HEAD:${branch}"; then exit 0; fi
            git fetch origin "${branch}"
            git rebase "origin/${branch}"
            sleep 2
          done
          exit 1
      - name: Mark review required if conflicts remain
        if: env.REPAIR_REVIEW_CODE == '2'
        run: echo 'Repair persisted, but normalized question conflicts remain for review.'
