name: Verify live memory print fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-memory-print-live.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      PAGE_URL: https://yo666ha-boop.github.io/english-vocab-app/
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - name: Verify deployed HTML and markers
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED="$(sha256sum index.html | awk '{print $1}')"
          LIVE=''
          for i in $(seq 1 60); do
            curl -L -sS -o /tmp/live.html "$PAGE_URL" || true
            LIVE="$(sha256sum /tmp/live.html 2>/dev/null | awk '{print $1}' || true)"
            [ "$LIVE" = "$EXPECTED" ] && break
            sleep 5
          done
          test "$LIVE" = "$EXPECTED"
          grep -q 'MEMORY_PRINT_MAX_ROWS = 1000' /tmp/live.html
          grep -q 'MEMORY_PRINT_ROWS_PER_PAGE = 18' /tmp/live.html
          grep -q '1000 語以下' /tmp/live.html
          grep -q 'rb-memory-page' /tmp/live.html
          grep -q 'r.elem_category_short || r.elem_category || r.elem_type' /tmp/live.html
          grep -q 'memory-print-safe-final' /tmp/live.html
          mkdir -p audit
          cat > audit/MEMORY_PRINT_LIVE.json <<JSON
          {
            "status": "pass",
            "page_url": "$PAGE_URL",
            "index_sha256": "$EXPECTED",
            "live_matches_main": true,
            "max_rows": 1000,
            "rows_per_page": 18,
            "large_selection_guard_present": true,
            "pagination_present": true,
            "elementary_group_key_fix_present": true,
            "final_runtime_guard_present": true,
            "checked_at_utc": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          JSON
      - name: Commit live audit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --rebase --autostash origin main
          git add audit/MEMORY_PRINT_LIVE.json
          git diff --cached --quiet && exit 0
          git commit -m 'test: record live 1000-word memory print fix'
          git push origin HEAD:main
