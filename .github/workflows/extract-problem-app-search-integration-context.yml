name: Extract problem app search integration context

on:
  push:
    branches:
      - fix-vocab-grammar-range-20260825
    paths:
      - tools/extract_problem_app_search_integration_context.mjs
      - .github/workflows/extract-problem-app-search-integration-context.yml

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tools/extract_problem_app_search_integration_context.mjs
      - name: Commit context
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add audit/PROBLEM_APP_SEARCH_INTEGRATION_CONTEXT.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'diag: record problem app search integration context [skip ci]'
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
