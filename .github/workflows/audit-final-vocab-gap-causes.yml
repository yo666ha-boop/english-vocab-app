name: Audit mature final vocab gap causes

on:
  push:
    branches:
      - fix-vocab-grammar-range-20260825
    paths:
      - tools/audit_final_vocab_gap_causes.mjs
      - .github/workflows/audit-final-vocab-gap-causes.yml
      - audit/PROBLEM_APP_VOCAB_FINAL_SECTION_GAPS.json
      - problem-app/index.html

permissions:
  contents: write

concurrency:
  group: final-vocab-gap-causes-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Audit mature gap causes
        run: node tools/audit_final_vocab_gap_causes.mjs
      - name: Commit audit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add audit/PROBLEM_APP_VOCAB_FINAL_GAP_CAUSES.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'audit: record mature vocab gap causes [skip ci]'
          branch="${GITHUB_REF_NAME}"
          for attempt in 1 2 3 4; do
            if git push origin "HEAD:${branch}"; then exit 0; fi
            git fetch origin "${branch}"
            git rebase "origin/${branch}"
            sleep 2
          done
          exit 1
