name: Finalize Mikami Canonical From Drive Transfer

on:
  push:
    branches: [mikami-canonical-repair]
    paths:
      - '.github/workflows/finalize-mikami-canonical-drive.yml'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/finalize-mikami-canonical-drive.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Fetch and validate refreshed Drive transfer copy
        shell: bash
        run: |
          set -euo pipefail
          URL='https://drive.usercontent.google.com/download?id=1MoArYnD3Npy-LePUrH8a82lg4uKyhND4&export=download&confirm=t'
          curl --compressed -fL --retry 2 --connect-timeout 20 --max-time 120 "$URL" -o /tmp/mikami-canonical.html
          test -s /tmp/mikami-canonical.html
          echo "downloaded_bytes=$(wc -c < /tmp/mikami-canonical.html)"
          test "$(wc -c < /tmp/mikami-canonical.html)" -eq 4035500
          file /tmp/mikami-canonical.html
          node <<'NODE'
          const fs=require('fs');
          const p='/tmp/mikami-canonical.html';
          const s=fs.readFileSync(p,'utf8');
          for(const marker of ['id="qb-data"','id="meta-data"','R1-PRON-','M2-GER2-','M2-COMP2-','M2-INF2-','M2X-INF-','M3N-']){
            if(!s.includes(marker)) throw new Error('not canonical: missing '+marker);
          }
          const m=s.match(/<script\s+id=["']qb-data["']\s+type=["']application\/json["']>([\s\S]*?)<\/script>/);
          if(!m) throw new Error('qb-data not found');
          const qb=JSON.parse(m[1]);
          if(!Array.isArray(qb) || qb.length<10000) throw new Error('question bank too small: '+(qb?.length??'invalid'));
          console.log('canonical_question_count='+qb.length);
          NODE

      - name: Run canonical V3/V4 repair pipeline
        run: |
          mkdir -p dist/final
          node tools/run_mikami_pipeline_v3.mjs \
            /tmp/mikami-canonical.html \
            'dist/final/みかみ塾英語問題アプリ_正本修正版_20260819.html'

      - name: Verify final output
        shell: bash
        run: |
          set -euo pipefail
          OUT='dist/final/みかみ塾英語問題アプリ_正本修正版_20260819.html'
          AUDIT="$OUT.pipeline-v3.audit.json"
          test -s "$OUT"
          test -s "$AUDIT"
          grep -q '"status": "OK"' "$AUDIT"
          grep -q 'v7-2026-08-18-1based' "$OUT"
          grep -q 'passesPrereqGrammar(item)' "$OUT"
          grep -q 'passesQualityGate(item)' "$OUT"
          grep -q 'const infinitiveBlank =' "$OUT"
          grep -q '"m2_infinitive_bank_v4_changed"' "$AUDIT"
          if grep -Eqi 'This is (he|she|we)\b|\bthan He\b|否定文または疑問文|\bHe gots up\b|\bwents there\b' "$OUT"; then
            echo 'Known-bad pattern remains in final HTML'
            exit 1
          fi
          if grep -Eqi '"a":"To"|\bto\s*\(\s*\)\s*[A-Za-z]' "$OUT"; then
            echo 'M2/M3 infinitive blank defect remains in final HTML'
            exit 1
          fi

      - name: Package final repaired app
        shell: bash
        run: |
          cp release/README_FINALIZE.txt dist/final/README_修正内容.txt
          cd dist/final
          zip -9 '../みかみ塾英語問題アプリ_正本修正版_20260819.zip' \
            'みかみ塾英語問題アプリ_正本修正版_20260819.html' \
            'みかみ塾英語問題アプリ_正本修正版_20260819.html.pipeline-v3.audit.json' \
            'README_修正内容.txt'

      - name: Upload final repaired app
        uses: actions/upload-artifact@v4
        with:
          name: mikami-english-question-app-canonical-repaired-20260819
          path: dist/みかみ塾英語問題アプリ_正本修正版_20260819.zip
          if-no-files-found: error
