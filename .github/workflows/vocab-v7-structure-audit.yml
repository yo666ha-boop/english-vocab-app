name: Vocab v7 structure audit

on:
  push:
    branches: [vocab-master-v7]
    paths:
      - 'tools/audit_vocab_structure.py'
      - '.github/workflows/vocab-v7-structure-audit.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: vocab-master-v7
      - name: Audit embedded vocabulary structure
        run: python tools/audit_vocab_structure.py
      - name: Commit audit report
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add audit/VOCAB_STRUCTURE_AUDIT.json
          git diff --cached --quiet && exit 0
          git commit -m 'chore(vocab): record v7 structure audit'
          git push origin HEAD:vocab-master-v7
