name: Publish hardened MyGPT problem app v2 from exact v1 chunks

on:
  push:
    branches: [mikami-canonical-repair]
    paths:
      - 'release/transfer/mikami-routing-xz/READY_V2.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rebuild-publish-v2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mikami-canonical-repair
          fetch-depth: 0

      - name: Reconstruct exact v1 and deterministically harden URL gate
        id: build
        shell: bash
        run: |
          set -euo pipefail
          DIR='release/transfer/mikami-routing-xz'
          READY="$DIR/READY_V2.txt"
          test -s "$READY"
          grep -qx 'SOURCE_V1_BYTES=3812063' "$READY"
          grep -qx 'SOURCE_V1_SHA256=6c3c5c6e42939ee701667cc18cf07d10403afa063ece557ed3052c44c95e0c81' "$READY"
          grep -qx 'EXPECTED_V2_BYTES=3812209' "$READY"
          grep -qx 'EXPECTED_V2_SHA256=83921d1bb9b0ed3028d1151c138326e7698278906e6d01180bc1fb1f6b2044a0' "$READY"
          mkdir -p /tmp/mikami-v2
          find "$DIR" -maxdepth 1 -type f -name 'chunk-*.b64' -print0 | sort -z | xargs -0 cat | tr -d '\r\n ' > /tmp/mikami-v2/payload.b64
          base64 -d /tmp/mikami-v2/payload.b64 > /tmp/mikami-v2/payload.xz
          xz -dc /tmp/mikami-v2/payload.xz > /tmp/mikami-v2/v1.html
          test "$(wc -c < /tmp/mikami-v2/v1.html | tr -d ' ')" = '3812063'
          test "$(sha256sum /tmp/mikami-v2/v1.html | awk '{print $1}')" = '6c3c5c6e42939ee701667cc18cf07d10403afa063ece557ed3052c44c95e0c81'
          python - <<'PY'
          from pathlib import Path
          import re, hashlib
          p=Path('/tmp/mikami-v2/v1.html')
          s=p.read_text(encoding='utf-8')
          old="""      if (url.protocol !== 'https:') return '';\n      return url.href;"""
          new="""      if (url.protocol !== 'https:') return '';\n      if (!['chatgpt.com', 'chat.openai.com'].includes(url.hostname)) return '';\n      if (!/^\\/g\\/[A-Za-z0-9_-]+/.test(url.pathname)) return '';\n      return url.href;"""
          assert s.count(old)==1, f'old normalize block count={s.count(old)}'
          m=re.search(r'<script\s+id=["\']qb-data["\']\s+type=["\']application/json["\']>([\s\S]*?)</script>',s,re.I)
          assert m, 'qb-data missing in v1'
          qb_before=hashlib.sha256(m.group(1).encode()).hexdigest()
          t=s.replace(old,new,1)
          m2=re.search(r'<script\s+id=["\']qb-data["\']\s+type=["\']application/json["\']>([\s\S]*?)</script>',t,re.I)
          assert m2 and hashlib.sha256(m2.group(1).encode()).hexdigest()==qb_before, 'qb-data changed by v2 handoff hardening'
          assert "['chatgpt.com', 'chat.openai.com'].includes(url.hostname)" in t
          assert "/^\\/g\\/[A-Za-z0-9_-]+/.test(url.pathname)" in t
          assert 'be820c3e4d5c26773d642f1c055fea33f2796d71b6fca16f4e1edf5efc6f9213' not in t
          assert '01_mikami_english_question_bank_knowledge.jsonl' not in t
          Path('/tmp/mikami-v2/v2.html').write_text(t,encoding='utf-8')
          print('QB_DATA_SHA256='+qb_before)
          PY
          BYTES=$(wc -c < /tmp/mikami-v2/v2.html | tr -d ' ')
          SHA=$(sha256sum /tmp/mikami-v2/v2.html | awk '{print $1}')
          test "$BYTES" = '3812209'
          test "$SHA" = '83921d1bb9b0ed3028d1151c138326e7698278906e6d01180bc1fb1f6b2044a0'
          echo "bytes=$BYTES" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo 'pass=true' >> "$GITHUB_OUTPUT"

      - name: Publish only problem-app/index.html to main and preserve vocabulary root
        id: publish
        if: steps.build.outputs.pass == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          ROOT_BEFORE=$(git show origin/main:index.html | sha256sum | awk '{print $1}')
          rm -rf /tmp/mikami-main-v2
          git worktree add /tmp/mikami-main-v2 origin/main
          cd /tmp/mikami-main-v2
          git switch -c mikami-problem-publish-v2 origin/main
          mkdir -p problem-app
          cp /tmp/mikami-v2/v2.html problem-app/index.html
          test "$(wc -c < problem-app/index.html | tr -d ' ')" = '3812209'
          test "$(sha256sum problem-app/index.html | awk '{print $1}')" = '83921d1bb9b0ed3028d1151c138326e7698278906e6d01180bc1fb1f6b2044a0'
          ROOT_AFTER=$(sha256sum index.html | awk '{print $1}')
          test "$ROOT_BEFORE" = "$ROOT_AFTER"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- problem-app/index.html
          if ! git diff --cached --quiet; then
            git commit -m 'publish: harden isolated MyGPT problem app URL gate'
            git push origin HEAD:main
          fi
          echo "root_before=$ROOT_BEFORE" >> "$GITHUB_OUTPUT"
          echo "root_after=$ROOT_AFTER" >> "$GITHUB_OUTPUT"
          echo 'pass=true' >> "$GITHUB_OUTPUT"

      - name: Verify exact GitHub Pages v2
        id: pages
        if: steps.publish.outputs.pass == 'true'
        shell: bash
        run: |
          set -u
          URL='https://yo666ha-boop.github.io/english-vocab-app/problem-app/'
          OUT='/tmp/mikami-pages-v2.html'
          PASS=false; HTTP=000; BYTES=0; SHA=''
          for i in $(seq 1 20); do
            HTTP=$(curl -sS -L --connect-timeout 15 --max-time 45 -w '%{http_code}' -o "$OUT" "$URL" || echo 000)
            if test -s "$OUT"; then BYTES=$(wc -c < "$OUT" | tr -d ' '); SHA=$(sha256sum "$OUT"|awk '{print $1}'); fi
            if test "$HTTP" = 200 && test "$BYTES" = 3812209 && test "$SHA" = 83921d1bb9b0ed3028d1151c138326e7698278906e6d01180bc1fb1f6b2044a0; then
              grep -Fq "['chatgpt.com', 'chat.openai.com'].includes(url.hostname)" "$OUT" && \
              grep -Fq "/^\\/g\\/[A-Za-z0-9_-]+/.test(url.pathname)" "$OUT" && \
              ! grep -q 'be820c3e4d5c26773d642f1c055fea33f2796d71b6fca16f4e1edf5efc6f9213' "$OUT" && PASS=true
            fi
            test "$PASS" = true && break
            sleep 8
          done
          echo "pass=$PASS" >> "$GITHUB_OUTPUT"
          echo "http=$HTTP" >> "$GITHUB_OUTPUT"
          echo "bytes=$BYTES" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          test "$PASS" = true

      - name: Record v2 publication status race-safely
        if: always()
        shell: bash
        env:
          BUILD_PASS: ${{ steps.build.outputs.pass }}
          BUILD_BYTES: ${{ steps.build.outputs.bytes }}
          BUILD_SHA: ${{ steps.build.outputs.sha }}
          PUBLISH_PASS: ${{ steps.publish.outputs.pass }}
          ROOT_BEFORE: ${{ steps.publish.outputs.root_before }}
          ROOT_AFTER: ${{ steps.publish.outputs.root_after }}
          PAGES_PASS: ${{ steps.pages.outputs.pass }}
          PAGES_HTTP: ${{ steps.pages.outputs.http }}
          PAGES_BYTES: ${{ steps.pages.outputs.bytes }}
          PAGES_SHA: ${{ steps.pages.outputs.sha }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3 4 5; do
            git fetch origin mikami-canonical-repair
            git reset --hard origin/mikami-canonical-repair
            mkdir -p release/generated
            if test "${BUILD_PASS:-false}" = true && test "${PUBLISH_PASS:-false}" = true && test "${PAGES_PASS:-false}" = true; then STATUS='PASS_EXACT_V2'; else STATUS='FAIL'; fi
            cat > release/generated/problem_app_handoff_v2_publication.status.txt <<EOF
          STATUS=$STATUS
          RUN_ID=$GITHUB_RUN_ID
          TRIGGER_SHA=$GITHUB_SHA
          SOURCE_V1_BYTES=3812063
          SOURCE_V1_SHA256=6c3c5c6e42939ee701667cc18cf07d10403afa063ece557ed3052c44c95e0c81
          BUILD_PASS=${BUILD_PASS:-false}
          V2_BYTES=${BUILD_BYTES:-0}
          V2_SHA256=${BUILD_SHA:-}
          EXPECTED_V2_BYTES=3812209
          EXPECTED_V2_SHA256=83921d1bb9b0ed3028d1151c138326e7698278906e6d01180bc1fb1f6b2044a0
          CUSTOM_GPT_URL_HOST_GATE=true
          CUSTOM_GPT_URL_G_PATH_GATE=true
          MAIN_PROBLEM_PATH_PUBLISH_PASS=${PUBLISH_PASS:-false}
          ROOT_INDEX_SHA_BEFORE=${ROOT_BEFORE:-}
          ROOT_INDEX_SHA_AFTER=${ROOT_AFTER:-}
          ROOT_INDEX_UNCHANGED_REQUIRED=true
          PAGES_PASS=${PAGES_PASS:-false}
          PAGES_HTTP=${PAGES_HTTP:-000}
          PAGES_BYTES=${PAGES_BYTES:-0}
          PAGES_SHA256=${PAGES_SHA:-}
          PHOTO_ATTACHMENT_LOCATION=MY_GPT_ONLY
          APP_PHOTO_ANALYSIS_PRIMARY=false
          PRIVATE_KNOWLEDGE_EMBEDDED=false
          EOF
            git add release/generated/problem_app_handoff_v2_publication.status.txt
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "record problem-app handoff v2 publication status (attempt ${attempt})"
            if git push origin HEAD:mikami-canonical-repair; then exit 0; fi
            sleep $((attempt*2))
          done
          exit 1
