name: Memory print Edge health check
# Final runtime guard verification

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'tools/test_memory_print.mjs'
      - '.github/workflows/memory-print-health.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: memory-print-health
  cancel-in-progress: true

jobs:
  chromium-memory-print:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.55.0-noble
    env:
      PAGE_URL: https://yo666ha-boop.github.io/english-vocab-app/
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - name: Wait for live Pages to match main
        id: live
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_SHA="$(sha256sum index.html | awk '{print $1}')"
          LIVE_SHA=''
          for i in $(seq 1 60); do
            curl -L -sS -o /tmp/live-index.html "$PAGE_URL" || true
            LIVE_SHA="$(sha256sum /tmp/live-index.html 2>/dev/null | awk '{print $1}' || true)"
            [ "$LIVE_SHA" = "$EXPECTED_SHA" ] && break
            sleep 5
          done
          test "$LIVE_SHA" = "$EXPECTED_SHA"
          echo "index_sha256=$EXPECTED_SHA" >> "$GITHUB_OUTPUT"
      - name: Install matching Playwright package only
        run: npm install --no-save playwright@1.55.0
      - name: Exercise memory print in Edge-equivalent Chromium
        id: smoke
        continue-on-error: true
        env:
          INDEX_SHA: ${{ steps.live.outputs.index_sha256 }}
        run: node tools/test_memory_print.mjs
      - name: Commit memory print audit
        if: always()
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --rebase --autostash origin main
          if [ -f audit/MEMORY_PRINT_SMOKE.json ]; then
            git add audit/MEMORY_PRINT_SMOKE.json
            if ! git diff --cached --quiet; then
              git commit -m 'test: record memory print Edge health result'
              git push origin HEAD:main
            fi
          fi
      - name: Require smoke pass
        if: always()
        run: |
          test -f audit/MEMORY_PRINT_SMOKE.json
          grep -q '"status": "pass"' audit/MEMORY_PRINT_SMOKE.json
