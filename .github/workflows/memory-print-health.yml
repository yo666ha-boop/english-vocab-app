name: Memory print Edge health check

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - '.github/workflows/memory-print-health.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: memory-print-health
  cancel-in-progress: true

jobs:
  chromium-memory-print:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.55.0-noble
    env:
      PAGE_URL: https://yo666ha-boop.github.io/english-vocab-app/
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - name: Wait for live Pages to match main
        id: live
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_SHA="$(sha256sum index.html | awk '{print $1}')"
          LIVE_SHA=''
          for i in $(seq 1 60); do
            curl -L -sS -o /tmp/live-index.html "$PAGE_URL" || true
            LIVE_SHA="$(sha256sum /tmp/live-index.html 2>/dev/null | awk '{print $1}' || true)"
            [ "$LIVE_SHA" = "$EXPECTED_SHA" ] && break
            sleep 5
          done
          test "$LIVE_SHA" = "$EXPECTED_SHA"
          echo "index_sha256=$EXPECTED_SHA" >> "$GITHUB_OUTPUT"
      - name: Install matching Playwright package only
        run: npm install --no-save playwright@1.55.0
      - name: Exercise memory print in Edge-equivalent Chromium
        env:
          INDEX_SHA: ${{ steps.live.outputs.index_sha256 }}
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const {chromium}=require('playwright');
          (async()=>{
            const browser=await chromium.launch();
            const page=await browser.newPage({viewport:{width:1365,height:768}});
            await page.goto(process.env.PAGE_URL,{waitUntil:'networkidle',timeout:60000});
            await page.locator('.title',{hasText:'英単語アプリ（統合版）'}).waitFor({timeout:15000});
            await page.evaluate(()=>{
              window.__alerts=[];
              window.__printCalled=0;
              window.alert=m=>window.__alerts.push(String(m));
              window.print=()=>{window.__printCalled++};
            });

            const t0=Date.now();
            await page.locator('#memoryPrintBtn').click();
            await page.waitForTimeout(100);
            const guardMs=Date.now()-t0;
            const guard=await page.evaluate(()=>({alerts:window.__alerts.slice(),prints:window.__printCalled}));
            if(guardMs>2500) throw new Error('default memory print click too slow: '+guardMs+'ms');
            if(guard.prints!==0) throw new Error('default full selection reached print dialog');
            if(!guard.alerts.some(x=>x.includes('300 語以下'))) throw new Error('safety message missing: '+JSON.stringify(guard));

            await page.evaluate(()=>{
              state.currentList=DATA.filter(r=>r.dataset==='textbook').slice(0,45);
              window.__alerts=[]; window.__printCalled=0;
            });
            await page.locator('#memoryPrintBtn').click();
            await page.waitForFunction(()=>window.__printCalled===1,null,{timeout:10000});
            const textbook=await page.evaluate(()=>({
              pages:document.querySelectorAll('#printSheet .rb-memory-page').length,
              rows:[...document.querySelectorAll('#printSheet .rb-memory-page')].map(p=>p.querySelectorAll('.rb-mem-row').length),
              prints:window.__printCalled
            }));
            if(textbook.pages!==3) throw new Error('45 rows should make 3 pages: '+JSON.stringify(textbook));
            if(textbook.rows.join(',')!=='18,18,9') throw new Error('wrong memory pagination: '+JSON.stringify(textbook));

            await page.locator('button.tab[data-dataset="elementary"]').click();
            await page.evaluate(()=>{
              state.currentList=DATA.filter(r=>r.dataset==='elementary').slice(0,20);
              window.__printCalled=0;
            });
            await page.locator('#memoryPrintBtn').click();
            await page.waitForFunction(()=>window.__printCalled===1,null,{timeout:10000});
            const elementary=await page.evaluate(()=>({
              pages:document.querySelectorAll('#printSheet .rb-memory-page').length,
              firstHeading:document.querySelector('#printSheet .rb-memory-group h3')?.textContent?.trim()||''
            }));
            if(elementary.pages!==2) throw new Error('20 elementary rows should make 2 pages');
            if(!elementary.firstHeading || elementary.firstHeading==='その他') throw new Error('elementary group heading broken: '+elementary.firstHeading);

            const status={status:'pass',page_url:process.env.PAGE_URL,index_sha256:process.env.INDEX_SHA,engine:'Chromium (Edge-equivalent)',checks:{default_full_selection_returns_quickly:true,default_full_selection_does_not_open_print:true,large_selection_guidance:true,textbook_45_paginated_18_18_9:true,print_invoked_for_safe_selection:true,elementary_group_heading_fixed:true},guard_ms:guardMs,textbook,elementary,checked_at_utc:new Date().toISOString()};
            fs.mkdirSync('audit',{recursive:true});
            fs.writeFileSync('audit/MEMORY_PRINT_SMOKE.json',JSON.stringify(status,null,2)+'\n');
            console.log(JSON.stringify(status,null,2));
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
      - name: Commit memory print audit
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --rebase --autostash origin main
          git add audit/MEMORY_PRINT_SMOKE.json
          git diff --cached --quiet && exit 0
          git commit -m 'test: record memory print Edge health pass'
          git push origin HEAD:main
