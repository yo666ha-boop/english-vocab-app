name: Diagnose problem app vocab grammar

on:
  push:
    branches:
      - fix-vocab-grammar-range-20260825
    paths-ignore:
      - audit/PROBLEM_APP_VOCAB_GRAMMAR_DIAG.txt
      - audit/PROBLEM_APP_VOCAB_GRAMMAR_DIAG.json

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract vocabulary and grammar filter contexts
        shell: python
        run: |
          from pathlib import Path
          import json, re

          p = Path('problem-app/index.html')
          text = p.read_text(encoding='utf-8')
          needles = [
              '単語制限','単語','語彙','文法','vocab','vocabulary','grammar',
              'wordLimit','word_limit','allowedWords','allowedVocabulary',
              'textbook','unit','section','grade','filter','candidate'
          ]
          out = []
          summary = {'bytes': len(text.encode('utf-8')), 'chars': len(text), 'newlines': text.count('\n'), 'occurrences': {}}
          for needle in needles:
              hits = [m.start() for m in re.finditer(re.escape(needle), text, flags=re.I)]
              summary['occurrences'][needle] = len(hits)
              out.append(f'===== {needle} : {len(hits)} hits =====')
              for n, idx in enumerate(hits[:50], 1):
                  a = max(0, idx - 900)
                  b = min(len(text), idx + len(needle) + 1800)
                  frag = text[a:b]
                  frag = frag.replace('><', '>\n<')
                  out.append(f'--- {needle} #{n} @ {idx} ---\n{frag}\n')
          # Collect likely JS identifiers/functions containing target terms.
          ids = sorted(set(re.findall(r'\b[A-Za-z_$][A-Za-z0-9_$]{2,}\b', text)))
          likely = [x for x in ids if re.search(r'(vocab|word|grammar|unit|section|textbook|grade|filter|candidate|range|allow)', x, re.I)]
          summary['likely_identifiers'] = likely[:1000]
          out.append('===== LIKELY IDENTIFIERS =====')
          out.extend(likely[:1000])

          Path('audit').mkdir(exist_ok=True)
          Path('audit/PROBLEM_APP_VOCAB_GRAMMAR_DIAG.txt').write_text('\n'.join(out), encoding='utf-8')
          Path('audit/PROBLEM_APP_VOCAB_GRAMMAR_DIAG.json').write_text(json.dumps(summary, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
      - name: Commit diagnostics
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add audit/PROBLEM_APP_VOCAB_GRAMMAR_DIAG.txt audit/PROBLEM_APP_VOCAB_GRAMMAR_DIAG.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'diag: capture problem-app vocab grammar filter contexts [skip ci]'
          git push
