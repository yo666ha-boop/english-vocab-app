name: Diversify problem duplicate core families

on:
  workflow_dispatch:
  push:
    branches:
      - fix-problem-content-quality-20260828
    paths:
      - 'tools/diversify_problem_duplicate_core_families.mjs'
      - '.github/workflows/diversify-problem-duplicate-core-families.yml'

permissions:
  contents: write

concurrency:
  group: diversify-problem-duplicate-core-families
  cancel-in-progress: false

jobs:
  diversify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-problem-content-quality-20260828
          fetch-depth: 0
      - run: |
          git fetch origin fix-problem-content-quality-20260828
          git reset --hard origin/fix-problem-content-quality-20260828
      - name: Diversify large exact-duplicate families
        run: node tools/diversify_problem_duplicate_core_families.mjs
      - name: Refresh quality and duplicate evidence
        shell: bash
        run: |
          set +e
          node tools/audit_problem_content_quality.mjs
          echo "quality_exit=$?"
          node tools/summarize_problem_duplicate_families.mjs
          exit 0
      - name: Commit diversified bank and evidence
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add problem-app/index.html audit/PROBLEM_APP_DUPLICATE_CORE_DIVERSIFY.json audit/PROBLEM_APP_CONTENT_QUALITY.json audit/PROBLEM_APP_DUPLICATE_FAMILY_SUMMARY.json
          if git diff --cached --quiet; then
            echo 'No diversification changes'
          else
            git commit -m 'fix: diversify largest duplicate problem families [skip ci]'
            git pull --rebase origin fix-problem-content-quality-20260828
            git push origin HEAD:fix-problem-content-quality-20260828
          fi
