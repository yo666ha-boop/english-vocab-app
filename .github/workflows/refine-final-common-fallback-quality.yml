name: Refine final common fallback quality

on:
  push:
    branches:
      - fix-vocab-grammar-range-20260825
    paths:
      - tools/refine_final_common_fallback_quality.mjs
      - .github/workflows/refine-final-common-fallback-quality.yml

permissions:
  contents: write

concurrency:
  group: refine-final-common-fallback-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Sync branch
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "${GITHUB_REF_NAME}"
          git rebase "origin/${GITHUB_REF_NAME}"
      - name: Refine fallback wording
        run: node tools/refine_final_common_fallback_quality.mjs
      - name: Validate runtime syntax
        run: node tools/check_problem_app_runtime_parse.mjs
      - name: Commit repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add problem-app/index.html tools/install_vocab_safe_fallback_v1.mjs audit/VOCAB_SAFE_FALLBACK_FINAL_COMMON_QUALITY_REPAIR.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'fix: refine final common fallback wording [skip ci]'
          branch="${GITHUB_REF_NAME}"
          for attempt in 1 2 3 4; do
            if git push origin "HEAD:${branch}"; then exit 0; fi
            git fetch origin "${branch}"
            git rebase "origin/${branch}"
            sleep 2
          done
          exit 1
