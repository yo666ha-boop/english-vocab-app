name: Extend vocab-safe fallback final common

on:
  push:
    branches:
      - fix-vocab-grammar-range-20260825
    paths:
      - tools/extend_vocab_safe_fallback_final_common.mjs
      - .github/workflows/extend-vocab-safe-fallback-final-common.yml

permissions:
  contents: write

concurrency:
  group: extend-vocab-safe-fallback-final-common-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Sync branch
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "${GITHUB_REF_NAME}"
          git rebase "origin/${GITHUB_REF_NAME}"
      - name: Apply generic final common grammar fallbacks
        run: node tools/extend_vocab_safe_fallback_final_common.mjs
      - name: Validate embedded JSON and runtime syntax
        shell: bash
        run: |
          set -euo pipefail
          node tools/check_problem_app_runtime_parse.mjs
          node -e "const fs=require('fs'); const s=fs.readFileSync('problem-app/index.html','utf8'); for(const id of ['qb-data','meta-data']){const m=s.match(new RegExp('<script\\s+id=[\\\"\\\']'+id+'[\\\"\\\'][^>]*>([\\s\\S]*?)<\\/script>','i')); if(!m) throw new Error(id+' missing'); JSON.parse(m[1]);}"
      - name: Commit repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add problem-app/index.html tools/install_vocab_safe_fallback_v1.mjs audit/VOCAB_SAFE_FALLBACK_FINAL_COMMON_REPAIR.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'fix: add generic safe fallbacks for final common grammar [skip ci]'
          branch="${GITHUB_REF_NAME}"
          for attempt in 1 2 3 4; do
            if git push origin "HEAD:${branch}"; then exit 0; fi
            git fetch origin "${branch}"
            git rebase "origin/${branch}"
            sleep 2
          done
          exit 1
