name: Summarize vocab low retention progression

on:
  push:
    branches:
      - fix-vocab-grammar-range-20260825
    paths:
      - tools/summarize_vocab_low_retention_progression.mjs
      - .github/workflows/summarize-vocab-low-retention-progression.yml
      - audit/PROBLEM_APP_VOCAB_LOW_RETENTION_ROWS.json

permissions:
  contents: write

concurrency:
  group: summarize-vocab-low-retention-${{ github.ref }}
  cancel-in-progress: false

jobs:
  summarize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-vocab-grammar-range-20260825
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Sync branch
        run: |
          git fetch origin fix-vocab-grammar-range-20260825
          git reset --hard origin/fix-vocab-grammar-range-20260825
      - name: Summarize learned-only under-50 progression
        run: node tools/summarize_vocab_low_retention_progression.mjs
      - name: Commit summary
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add audit/PROBLEM_APP_VOCAB_LOW_RETENTION_SUMMARY.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'audit: record under-50 vocab progression summary [skip ci]'
          git pull --rebase origin fix-vocab-grammar-range-20260825
          git push
