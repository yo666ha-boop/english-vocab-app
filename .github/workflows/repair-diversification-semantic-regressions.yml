name: Repair diversification semantic regressions

on:
  workflow_dispatch:
  push:
    branches:
      - fix-problem-content-quality-20260828
    paths:
      - 'tools/repair_diversification_semantic_regressions.mjs'
      - '.github/workflows/repair-diversification-semantic-regressions.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-problem-content-quality-20260828
          fetch-depth: 0
      - run: |
          git fetch origin fix-problem-content-quality-20260828
          git reset --hard origin/fix-problem-content-quality-20260828
      - run: node tools/repair_diversification_semantic_regressions.mjs
      - name: Refresh quality evidence
        shell: bash
        run: |
          set +e
          node tools/audit_problem_content_quality.mjs
          echo "quality_exit=$?"
          node tools/summarize_problem_duplicate_families.mjs
          exit 0
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add problem-app/index.html audit/PROBLEM_APP_DIVERSIFICATION_SEMANTIC_CLEANUP.json audit/PROBLEM_APP_CONTENT_QUALITY.json audit/PROBLEM_APP_DUPLICATE_FAMILY_SUMMARY.json
          if ! git diff --cached --quiet; then
            git commit -m 'fix: clean diversified question semantics [skip ci]'
            git pull --rebase origin fix-problem-content-quality-20260828
            git push origin HEAD:fix-problem-content-quality-20260828
          fi
