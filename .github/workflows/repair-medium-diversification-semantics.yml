name: Repair medium diversification semantics
on:
  push:
    branches: [fix-problem-content-quality-20260828]
    paths:
      - 'tools/repair_medium_diversification_semantics.mjs'
      - 'audit/PROBLEM_APP_MEDIUM_SEMANTIC_TRIGGER.md'
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-problem-content-quality-20260828
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Repair semantics
        run: node tools/repair_medium_diversification_semantics.mjs
      - name: Content quality audit
        run: node tools/audit_problem_content_quality.mjs || true
      - name: Duplicate summary
        run: node tools/summarize_problem_duplicate_families.mjs
      - name: Commit repairs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add problem-app/index.html audit/PROBLEM_APP_MEDIUM_SEMANTIC_REPAIR.json audit/PROBLEM_APP_CONTENT_QUALITY.json audit/PROBLEM_APP_DUPLICATE_FAMILY_SUMMARY.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'fix: repair medium diversification semantics [skip ci]'
          git pull --rebase origin fix-problem-content-quality-20260828
          git push origin HEAD:fix-problem-content-quality-20260828
