name: Problem app vocab browser matrix

on:
  push:
    branches:
      - fix-vocab-grammar-range-20260825
    paths:
      - .github/workflows/problem-app-vocab-browser-matrix.yml
      - audit/PROBLEM_APP_VOCAB_BROWSER_TRIGGER.md
      - problem-app/index.html

permissions:
  contents: write

jobs:
  matrix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Playwright Chromium
        run: |
          pip install playwright
          playwright install --with-deps chromium
      - name: Measure actual UI candidate counts
        shell: python
        run: |
          from pathlib import Path
          from playwright.sync_api import sync_playwright
          import json, re

          url = Path('problem-app/index.html').resolve().as_uri()
          result = {'url': url, 'matrix': {}}

          def candidate_count(text):
              m = re.search(r'この条件で使える候補\s*(\d+)件', text or '')
              return int(m.group(1)) if m else None

          with sync_playwright() as p:
              browser = p.chromium.launch()
              page = browser.new_page()
              page.goto(url, wait_until='load')
              page.select_option('#subjectSelect', '英語')

              for grade in ['中1','中2','中3']:
                  page.select_option('#gradeSelect', grade)
                  page.wait_for_timeout(50)
                  page.evaluate("""
                    () => {
                      document.querySelectorAll('input[data-stage], input[data-type]').forEach(x => {
                        x.checked = true;
                        x.dispatchEvent(new Event('change', {bubbles:true}));
                      });
                    }
                  """)
                  result['matrix'][grade] = {}
                  textbooks = page.locator('#textbookSelect option').evaluate_all("els => els.map(x => x.value).filter(Boolean)")
                  for tb in textbooks:
                      page.select_option('#textbookSelect', tb)
                      page.wait_for_timeout(30)
                      sections = page.locator('#sectionSelect option').evaluate_all("els => els.map(x => ({value:x.value,text:x.textContent}))")
                      valid = [x for x in sections if x['value']]
                      if not valid:
                          result['matrix'][grade][tb] = {'error':'no sections'}
                          continue
                      positions = sorted(set([0, len(valid)//2, len(valid)-1]))
                      # Vocab OFF baseline after all grammar stages and all problem types are checked.
                      page.select_option('#vocabMode', 'off')
                      page.wait_for_timeout(20)
                      off_text = page.locator('#builderStatus').inner_text()
                      rec = {'vocab_off_all_grammar': {'candidates':candidate_count(off_text),'status':off_text}, 'vocab_on_sections':[]}
                      page.select_option('#vocabMode', 'on')
                      for pos in positions:
                          sec = valid[pos]
                          page.select_option('#sectionSelect', sec['value'])
                          page.wait_for_timeout(20)
                          text = page.locator('#builderStatus').inner_text()
                          rec['vocab_on_sections'].append({'position':pos+1,'section_count':len(valid),'section':sec['text'],'candidates':candidate_count(text),'status':text})
                      result['matrix'][grade][tb] = rec
              result['console_errors'] = []
              browser.close()

          Path('audit').mkdir(exist_ok=True)
          Path('audit/PROBLEM_APP_VOCAB_BROWSER_MATRIX.json').write_text(json.dumps(result, ensure_ascii=False, indent=2)+'\n', encoding='utf-8')
      - name: Commit matrix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add audit/PROBLEM_APP_VOCAB_BROWSER_MATRIX.json
          if git diff --cached --quiet; then
            echo 'Matrix unchanged; nothing to commit.'
            exit 0
          fi
          git commit -m 'test: record actual vocab gate browser matrix [skip ci]'

          branch="${GITHUB_REF_NAME}"
          for attempt in 1 2 3; do
            echo "Push attempt ${attempt} for ${branch}"
            git fetch origin "${branch}"
            if ! git rebase "origin/${branch}"; then
              git rebase --abort || true
              echo 'Rebase conflict while preserving measured matrix.' >&2
              exit 1
            fi
            if git push origin "HEAD:${branch}"; then
              echo 'Matrix committed successfully.'
              exit 0
            fi
            sleep 2
          done
          echo 'Failed to push matrix after retries.' >&2
          exit 1
