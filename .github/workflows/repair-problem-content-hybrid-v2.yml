name: Repair problem content hybrid Japanese v2

on:
  workflow_dispatch:
  push:
    branches:
      - fix-problem-content-quality-20260828
    paths:
      - 'tools/repair_problem_content_hybrid_japanese_v2.mjs'
      - '.github/workflows/repair-problem-content-hybrid-v2.yml'

permissions:
  contents: write

concurrency:
  group: repair-problem-content-hybrid-v2
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-problem-content-quality-20260828
          fetch-depth: 0
      - name: Sync latest branch
        run: |
          git fetch origin fix-problem-content-quality-20260828
          git reset --hard origin/fix-problem-content-quality-20260828
      - name: Repair hybrid Japanese and comparison semantics
        run: node tools/repair_problem_content_hybrid_japanese_v2.mjs
      - name: Refresh quality summaries
        shell: bash
        run: |
          set +e
          node tools/audit_problem_content_quality.mjs
          echo "audit_exit=$?"
          node tools/summarize_problem_content_templates.mjs
          exit 0
      - name: Commit repaired bank and evidence
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add problem-app/index.html audit/PROBLEM_APP_CONTENT_HYBRID_REPAIR_V2.json audit/PROBLEM_APP_CONTENT_QUALITY.json audit/PROBLEM_APP_CONTENT_TEMPLATE_SUMMARY.json
          if git diff --cached --quiet; then
            echo 'No repair changes'
          else
            git commit -m 'fix: repair hybrid Japanese content families v2 [skip ci]'
            git pull --rebase origin fix-problem-content-quality-20260828
            git push origin HEAD:fix-problem-content-quality-20260828
          fi
