name: Rebuild problem passMeta audit

on:
  push:
    branches:
      - fix-vocab-grammar-range-20260825
    paths:
      - tools/rebuild_problem_vocab_passmeta.mjs
      - .github/workflows/rebuild-problem-passmeta-audit.yml
      - audit/PROBLEM_APP_PASSMETA_REBUILD_TRIGGER.md

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build dry-run passMeta from canonical vocabulary
        run: node tools/rebuild_problem_vocab_passmeta.mjs
      - name: Commit audit outputs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add audit/PROBLEM_APP_PASSMETA_REBUILD_AUDIT.json audit/PROBLEM_APP_PASSMETA_CANDIDATE.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'test: record canonical passMeta rebuild dry-run [skip ci]'
          git push
