name: Vocab v7 PR audit

on:
  pull_request:
    branches: [main]
    paths:
      - 'tools/**'
      - '.github/workflows/vocab-v7-pr-audit.yml'
      - '.github/workflows/vocab-v7-structure-audit.yml'
      - 'audit/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract embedded textbook DATA
        run: node tools/extract_vocab_data.mjs
      - name: Run secondary structure scan
        run: python tools/audit_vocab_structure.py || true
      - name: Show audit summary
        run: cat audit/VOCAB_EMBEDDED_DATA_SUMMARY.txt
      - name: Upload audit outputs
        uses: actions/upload-artifact@v4
        with:
          name: vocab-v7-audit
          path: |
            audit/DATA_DECLARATION_SNIPPET.txt
            audit/VOCAB_STRUCTURE_AUDIT.json
            audit/VOCAB_EMBEDDED_DATA_SUMMARY.json
            audit/VOCAB_EMBEDDED_DATA_SUMMARY.txt
