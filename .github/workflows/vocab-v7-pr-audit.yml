name: Vocab v7 PR audit

on:
  pull_request:
    branches: [main]
    paths:
      - 'index.html'
      - 'data/v7_master.csv'
      - 'tools/**'
      - '.github/workflows/vocab-v7-pr-audit.yml'
      - '.github/workflows/vocab-v7-structure-audit.yml'
      - 'audit/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Primary Node audit
        run: node tools/extract_vocab_data.mjs

      - name: Independent Python audit
        run: python tools/audit_vocab_structure.py

      - name: Cross-check both audits
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const primary = JSON.parse(fs.readFileSync('audit/VOCAB_EMBEDDED_DATA_SUMMARY.json','utf8'));
          const secondary = JSON.parse(fs.readFileSync('audit/VOCAB_SECONDARY_AUDIT.json','utf8'));
          const fail = m => { console.error(m); process.exit(1); };
          const expected = {textbook:3975, exam:534, elementary:104};
          if (primary.data_array_count !== 4613) fail('primary total != 4613');
          if (secondary.data_array_count !== 4613) fail('secondary total != 4613');
          if (primary.textbook_record_count !== 3975) fail('primary textbook != 3975');
          if (secondary.record_count !== 3975) fail('secondary textbook != 3975');
          for (const [k,v] of Object.entries(expected)) {
            if (primary.dataset_counts[k] !== v) fail(`primary ${k} != ${v}`);
            if (secondary.dataset_counts[k] !== v) fail(`secondary ${k} != ${v}`);
          }
          for (const k of ['missing_english','missing_japanese','missing_kana','full_duplicate_group_count']) {
            if (primary[k] !== 0) fail(`primary ${k} != 0`);
            if (secondary[k] !== 0) fail(`secondary ${k} != 0`);
          }
          if (primary.index_sha256 !== secondary.index_sha256) fail('audits read different index.html');
          console.log('CROSS AUDIT PASS: 3975 textbook + 534 exam + 104 elementary = 4613');
          NODE

      - name: Show primary audit summary
        run: cat audit/VOCAB_EMBEDDED_DATA_SUMMARY.txt

      - name: Show secondary audit summary
        run: cat audit/VOCAB_SECONDARY_AUDIT.txt

      - name: Upload audit outputs
        uses: actions/upload-artifact@v4
        with:
          name: vocab-v7-audit
          path: |
            audit/DATA_DECLARATION_SNIPPET.txt
            audit/VOCAB_STRUCTURE_AUDIT.json
            audit/VOCAB_EMBEDDED_DATA_SUMMARY.json
            audit/VOCAB_EMBEDDED_DATA_SUMMARY.txt
            audit/VOCAB_SECONDARY_AUDIT.json
            audit/VOCAB_SECONDARY_AUDIT.txt
