name: Fix grammar chronology grade key

on:
  push:
    branches:
      - fix-vocab-grammar-range-20260825
    paths:
      - tools/fix_grammar_chronology_grade_key.mjs
      - .github/workflows/fix-grammar-chronology-grade-key.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fix grade-key normalization
        run: node tools/fix_grammar_chronology_grade_key.mjs
      - name: Parse runtime JavaScript
        run: node tools/check_problem_app_runtime_parse.mjs
      - name: Protect root app
        run: git diff --exit-code -- index.html
      - name: Commit fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add problem-app/index.html tools/install_problem_grammar_chronology.mjs audit/PROBLEM_APP_GRAMMAR_CHRONOLOGY_GRADE_KEY_FIX.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'fix: normalize grammar chronology grade key [skip ci]'
          git restore --worktree .
          git clean -fd
          branch="${GITHUB_REF_NAME}"
          for attempt in 1 2 3 4; do
            git fetch origin "${branch}"
            if ! git rebase "origin/${branch}"; then git rebase --abort || true; exit 1; fi
            if git push origin "HEAD:${branch}"; then exit 0; fi
            sleep 2
          done
          exit 1
