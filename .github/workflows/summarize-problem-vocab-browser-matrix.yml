name: Summarize problem vocab browser matrix

on:
  push:
    branches:
      - fix-vocab-grammar-range-20260825
    paths:
      - tools/summarize_problem_vocab_browser_matrix.mjs
      - .github/workflows/summarize-problem-vocab-browser-matrix.yml
      - audit/PROBLEM_APP_VOCAB_BROWSER_MATRIX.json

permissions:
  contents: write

jobs:
  summarize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Summarize exhaustive matrix
        run: node tools/summarize_problem_vocab_browser_matrix.mjs
      - name: Commit compact summary
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add audit/PROBLEM_APP_VOCAB_BROWSER_MATRIX_SUMMARY.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'audit: record exhaustive vocab matrix summary [skip ci]'
          branch="${GITHUB_REF_NAME}"
          for attempt in 1 2 3 4; do
            git fetch origin "${branch}"
            if ! git rebase "origin/${branch}"; then git rebase --abort || true; exit 1; fi
            if git push origin "HEAD:${branch}"; then exit 0; fi
            sleep 2
          done
          exit 1
