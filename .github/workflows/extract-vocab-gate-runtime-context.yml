name: Extract vocab gate runtime context

on:
  push:
    branches:
      - fix-vocab-grammar-range-20260825
    paths:
      - tools/extract_vocab_gate_runtime_context.mjs
      - .github/workflows/extract-vocab-gate-runtime-context.yml

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Extract runtime context
        run: node tools/extract_vocab_gate_runtime_context.mjs
      - name: Commit result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add audit/VOCAB_GATE_RUNTIME_CONTEXT.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'diag: record vocab gate runtime context [skip ci]'
          branch="${GITHUB_REF_NAME}"
          for attempt in 1 2 3; do
            git fetch origin "${branch}"
            if ! git rebase "origin/${branch}"; then git rebase --abort || true; exit 1; fi
            if git push origin "HEAD:${branch}"; then exit 0; fi
            sleep 2
          done
          exit 1
