name: Audit problem grammar chronology

# 2026-08-26: rerun final candidate after multigrade common fallback repair.
on:
  push:
    branches:
      - fix-vocab-grammar-range-20260825
    paths:
      - problem-app/index.html
      - tools/audit_problem_grammar_chronology.mjs
      - .github/workflows/audit-problem-grammar-chronology.yml

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Audit source-backed grammar anchors
        run: node tools/audit_problem_grammar_chronology.mjs
      - name: Commit chronology audit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add audit/PROBLEM_APP_GRAMMAR_CHRONOLOGY_AUDIT.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'audit: record source-backed grammar chronology anchors [skip ci]'
          git restore --worktree .
          git clean -fd
          branch="${GITHUB_REF_NAME}"
          for attempt in 1 2 3 4; do
            git fetch origin "${branch}"
            if ! git rebase "origin/${branch}"; then git rebase --abort || true; exit 1; fi
            if git push origin "HEAD:${branch}"; then exit 0; fi
            sleep 2
          done
          exit 1
