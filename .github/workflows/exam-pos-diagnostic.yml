name: Diagnose exam POS filtering

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/exam-pos-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - name: Diagnose embedded exam POS data and UI
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const html = fs.readFileSync('index.html','utf8');
          const marker = 'const DATA=';
          const start = html.indexOf(marker);
          if (start < 0) throw new Error('const DATA not found');
          let i = start + marker.length;
          while (/\s/.test(html[i])) i++;
          if (html[i] !== '[') throw new Error('DATA array start not found');
          let depth=0, inStr=false, esc=false, end=-1;
          for (let j=i;j<html.length;j++) {
            const ch=html[j];
            if (inStr) {
              if (esc) esc=false;
              else if (ch==='\\') esc=true;
              else if (ch==='"') inStr=false;
              continue;
            }
            if (ch==='"') { inStr=true; continue; }
            if (ch==='[') depth++;
            else if (ch===']') { depth--; if (depth===0) { end=j+1; break; } }
          }
          if (end<0) throw new Error('DATA array end not found');
          const data = JSON.parse(html.slice(i,end));
          const exam = data.filter(x=>x.dataset==='exam');
          const freq = key => Object.entries(exam.reduce((a,x)=>{const v=String(x[key]??'').trim()||'(blank)'; a[v]=(a[v]||0)+1; return a;},{})).sort((a,b)=>b[1]-a[1]);
          const needles=['品詞','posFilter','pos_filter','examPos','exam-pos','pos_raw','\.pos','posSelect','pos-select'];
          const snippets=[];
          for (const needle of needles) {
            let from=0;
            while (true) {
              const idx = needle==='\\.pos' ? html.indexOf('.pos',from) : html.indexOf(needle,from);
              if (idx<0) break;
              snippets.push({needle,index:idx,text:html.slice(Math.max(0,idx-1200),Math.min(html.length,idx+2200))});
              from=idx+needle.length;
              if (snippets.length>80) break;
            }
          }
          const report={
            exam_count:exam.length,
            exam_pos_blank:exam.filter(x=>!String(x.pos??'').trim()).length,
            exam_pos_raw_blank:exam.filter(x=>!String(x.pos_raw??'').trim()).length,
            pos_frequency:freq('pos'),
            pos_raw_frequency:freq('pos_raw'),
            sample_exam:exam.slice(0,20),
            snippet_count:snippets.length,
          };
          fs.mkdirSync('audit',{recursive:true});
          fs.writeFileSync('audit/EXAM_POS_DIAGNOSTIC.json',JSON.stringify(report,null,2)+'\n');
          fs.writeFileSync('audit/EXAM_POS_UI_SNIPPETS.txt',snippets.map((s,n)=>`===== ${n+1} ${s.needle} @ ${s.index} =====\n${s.text}\n`).join('\n'));
          console.log(JSON.stringify(report,null,2));
          NODE
      - name: Commit diagnostic
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add audit/EXAM_POS_DIAGNOSTIC.json audit/EXAM_POS_UI_SNIPPETS.txt
          git diff --cached --quiet && exit 0
          git commit -m 'chore: diagnose exam POS filtering'
          git pull --rebase origin main
          git push origin HEAD:main
