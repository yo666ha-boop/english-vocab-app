name: Apply exam POS repair

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/exam-pos-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - name: Apply reviewed exam POS data and UI filter
        run: node tools/fix_exam_pos_filter.mjs
      - name: Run primary embedded-data audit
        run: node tools/extract_vocab_data.mjs
      - name: Run secondary structure audit
        run: python3 tools/audit_vocab_structure.py
      - name: Commit repaired app
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html audit/EXAM_POS_FIX_RESULT.json audit/EXAM_POS_CLASSIFICATION.tsv audit/VOCAB_EMBEDDED_DATA_SUMMARY.json audit/VOCAB_EMBEDDED_DATA_SUMMARY.txt audit/VOCAB_SECONDARY_AUDIT.json audit/VOCAB_SECONDARY_AUDIT.txt
          git diff --cached --quiet && exit 0
          git commit -m 'fix(vocab): enable exam POS filtering'
          git pull --rebase origin main
          git push origin HEAD:main
