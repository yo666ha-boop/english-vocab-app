name: Diagnose exam POS filtering

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/exam-pos-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - name: Extract exact patch contexts
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const s=fs.readFileSync('index.html','utf8');
          const markers=[
            'const state', 'let state', 'var state',
            'const els', 'let els', 'var els',
            'function filteredRows', 'filteredRows =',
            'function renderList', 'renderList =',
            'function renderFilter', 'function refreshFilter',
            'examCategoryBox', 'posBox',
            'function setDataset', 'function activateDataset',
            "state.dataset = 'exam'", 'data-dataset="exam"'
          ];
          const out=[]; const seen=new Set();
          for(const m of markers){let p=0,n=0;while(true){const i=s.indexOf(m,p);if(i<0)break;const key=Math.floor(i/1000);if(!seen.has(key)){seen.add(key);out.push(`===== ${m} @ ${i} =====\n`+s.slice(Math.max(0,i-3000),Math.min(s.length,i+7000)));}p=i+m.length;if(++n>=8)break;}}
          fs.mkdirSync('audit',{recursive:true});
          fs.writeFileSync('audit/EXAM_POS_PATCH_CONTEXT.txt',out.join('\n\n'));
          console.log('contexts='+out.length);
          NODE
      - name: Commit context
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add audit/EXAM_POS_PATCH_CONTEXT.txt
          git diff --cached --quiet && exit 0
          git commit -m 'chore: record exam POS patch context'
          git pull --rebase origin main
          git push origin HEAD:main
