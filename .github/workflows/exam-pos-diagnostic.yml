name: Apply exam POS repair

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/exam-pos-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - name: Apply reviewed exam POS data and UI filter
        id: apply
        continue-on-error: true
        shell: bash
        run: |
          set +e
          node tools/fix_exam_pos_filter.mjs > >(tee audit/EXAM_POS_FIX_WORKFLOW.log) 2>&1
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          echo "run_id=${GITHUB_RUN_ID}" > audit/EXAM_POS_FIX_WORKFLOW_STATUS.txt
          echo "exit_code=$code" >> audit/EXAM_POS_FIX_WORKFLOW_STATUS.txt
          exit $code
      - name: Run primary embedded-data audit
        if: steps.apply.outcome == 'success'
        run: node tools/extract_vocab_data.mjs
      - name: Run secondary structure audit
        if: steps.apply.outcome == 'success'
        run: python3 tools/audit_vocab_structure.py
      - name: Commit repair result or failure log
        if: always()
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add audit/EXAM_POS_FIX_WORKFLOW.log audit/EXAM_POS_FIX_WORKFLOW_STATUS.txt
          if [ "${{ steps.apply.outcome }}" = "success" ]; then
            git add index.html audit/EXAM_POS_FIX_RESULT.json audit/EXAM_POS_CLASSIFICATION.tsv audit/VOCAB_EMBEDDED_DATA_SUMMARY.json audit/VOCAB_EMBEDDED_DATA_SUMMARY.txt audit/VOCAB_SECONDARY_AUDIT.json audit/VOCAB_SECONDARY_AUDIT.txt
          fi
          git diff --cached --quiet && exit 0
          if [ "${{ steps.apply.outcome }}" = "success" ]; then
            git commit -m 'fix(vocab): enable exam POS filtering'
          else
            git commit -m 'chore: record exam POS repair failure'
          fi
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Fail workflow when repair failed
        if: steps.apply.outcome != 'success'
        run: exit 1
