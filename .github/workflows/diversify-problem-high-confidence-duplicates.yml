name: Diversify problem high-confidence duplicates

on:
  workflow_dispatch:
  push:
    branches:
      - fix-problem-content-quality-20260828
    paths:
      - 'tools/diversify_problem_high_confidence_duplicate_families.mjs'
      - '.github/workflows/diversify-problem-high-confidence-duplicates.yml'

permissions:
  contents: write

jobs:
  diversify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-problem-content-quality-20260828
      - name: Sync latest branch
        run: git pull --ff-only origin fix-problem-content-quality-20260828
      - name: Check syntax
        run: node --check tools/diversify_problem_high_confidence_duplicate_families.mjs
      - name: Diversify high-confidence families
        run: node tools/diversify_problem_high_confidence_duplicate_families.mjs
      - name: Validate bank structure and content quality
        shell: bash
        run: |
          node - <<'NODE'
          const fs=require('fs');const h=fs.readFileSync('problem-app/index.html','utf8');const m=/<script\s+id=["']qb-data["'][^>]*>([\s\S]*?)<\/script>/i.exec(h);if(!m)throw Error('qb-data');const all=JSON.parse(m[1]);const e=all.filter(x=>x&&x.subject==='英語');if(e.length!==10511)throw Error('english count '+e.length);if(new Set(e.map(x=>x.id)).size!==10511)throw Error('unique id count');
          NODE
          set +e
          node tools/audit_problem_content_quality.mjs
          code=$?
          set -e
          node - <<'NODE'
          const fs=require('fs');const a=JSON.parse(fs.readFileSync('audit/PROBLEM_APP_CONTENT_QUALITY.json','utf8'));const bad=(a.hard_failures||[]).filter(x=>!String(x).startsWith('duplicate_qa_row_ratio:'));if(bad.length)throw Error('content regressions: '+bad.join(','));if((a.exact_duplicate_question_answer?.groups_ge5||0)!==0)throw Error('ge5 duplicate regression');
          NODE
          echo audit_exit=$code
      - name: Refresh semantic duplicate review
        run: node tools/audit_problem_semantic_duplicate_review.mjs
      - name: Commit bank and evidence
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add problem-app/index.html audit/PROBLEM_APP_HIGH_CONFIDENCE_DUPLICATE_DIVERSIFICATION.json audit/PROBLEM_APP_CONTENT_QUALITY.json audit/PROBLEM_APP_SEMANTIC_DUPLICATE_REVIEW.json
          if git diff --cached --quiet; then echo 'No changes'; else git commit -m 'fix: diversify high-confidence duplicate families [skip ci]' && git push; fi
