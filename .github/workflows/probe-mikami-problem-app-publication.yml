name: Probe Mikami Problem App Publication

on:
  push:
    branches: [mikami-canonical-repair]
    paths:
      - 'tools/probe_mikami_problem_app_publication.mjs'
      - '.github/workflows/probe-mikami-problem-app-publication.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mikami-canonical-repair

      - name: Probe production body without accepting broken deployment
        id: probe
        continue-on-error: true
        run: |
          set +e
          node tools/probe_mikami_problem_app_publication.mjs > /tmp/probe.json 2>&1
          CODE=$?
          echo "exit=$CODE" >> "$GITHUB_OUTPUT"
          cat /tmp/probe.json
          exit $CODE

      - name: Record exact publication probe status from response truth
        run: |
          set -euo pipefail
          mkdir -p release/generated
          node - <<'NODE'
          const fs=require('fs');
          let p={};
          try { p=JSON.parse(fs.readFileSync('/tmp/probe.json','utf8')); }
          catch(e) { p={pass:false,error:fs.readFileSync('/tmp/probe.json','utf8')}; }
          const status=p.pass === true ? 'PASS' : 'FAIL';
          const lines=[
            `STATUS=${status}`,
            `RUN_ID=${process.env.GITHUB_RUN_ID}`,
            `TESTED_HEAD_SHA=${process.env.GITHUB_SHA}`,
            `URL=${p.url||'https://mikami-juku-english-problem-app.vercel.app/'}`,
            `HTTP_STATUS=${p.httpStatus??''}`,
            `RESPONSE_BYTES=${p.bytes??''}`,
            `RESPONSE_SHA256=${p.sha256??''}`,
            `EXPECTED_BYTES=${p.expectedBytes??3812063}`,
            `EXPECTED_SHA256=${p.expectedSha||'6c3c5c6e42939ee701667cc18cf07d10403afa063ece557ed3052c44c95e0c81'}`,
            `EXACT_BODY_PASS=${p.pass===true}`,
            `PATH_STRING_ONLY=${p.pathStringOnly??''}`,
            `PRIVATE_KNOWLEDGE_LEAK=${p.privateKnowledgeLeak??''}`,
            `PHOTO_ATTACHMENT_LOCATION=MY_GPT_ONLY`,
            `APP_PHOTO_ANALYSIS_PRIMARY=false`,
            `MAIN_TOUCHED=false`
          ];
          fs.writeFileSync('release/generated/problem_app_publication_probe.status.txt', lines.join('\n')+'\n');
          NODE
          cat release/generated/problem_app_publication_probe.status.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- release/generated/problem_app_publication_probe.status.txt
          if ! git diff --cached --quiet; then
            git commit -m 'record problem app publication probe status'
            git push origin HEAD:mikami-canonical-repair
          fi

      - name: Fail CI unless exact public app is live
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const p=JSON.parse(fs.readFileSync('/tmp/probe.json','utf8'));
          if (p.pass !== true) {
            console.error('PUBLICATION_PROBE_FAIL', JSON.stringify({httpStatus:p.httpStatus,bytes:p.bytes,sha256:p.sha256,pathStringOnly:p.pathStringOnly,privateKnowledgeLeak:p.privateKnowledgeLeak}));
            process.exit(1);
          }
          console.log('PUBLICATION_PROBE_PASS');
          NODE
