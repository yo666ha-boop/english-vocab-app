name: Test Mikami Answer GPT Evidence Chain

on:
  push:
    branches: [mikami-canonical-repair]
    paths:
      - 'tools/validate_mikami_answer_gpt_evidence_chain.mjs'
      - 'gpt/tests/mikami_answer_gpt_evidence_manifest.template.json'
      - '.github/workflows/test-mikami-answer-gpt-evidence-chain.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  evidence-chain-self-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run evidence chain self-test
        run: node tools/validate_mikami_answer_gpt_evidence_chain.mjs --self-test
      - name: Record status
        run: |
          mkdir -p release/generated
          cat > release/generated/answer_gpt_evidence_chain.status.txt <<EOF
          STATUS=PASS
          GATE_VERSION=evidence-chain-v1
          HEAD_SHA=${GITHUB_SHA}
          REGISTRATION_KIT_BOUND=true
          REQUIRED_PHOTO_CASES=4
          EVIDENCE_SHA_COLLISION_REJECTED=true
          WRONG_REGISTRATION_KIT_REJECTED=true
          PLACEHOLDER_GPT_URL_REJECTED=true
          A4_PAGE_RANGE=1-2
          REAL_RUNTIME_EXECUTED=false
          EOF
      - name: Commit status if changed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add release/generated/answer_gpt_evidence_chain.status.txt
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'record answer GPT evidence chain status'
          git push
