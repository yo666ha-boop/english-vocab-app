name: Repair multigrade common fallbacks

on:
  push:
    branches:
      - fix-vocab-grammar-range-20260825
    paths:
      - tools/repair_multigrade_common_fallbacks.mjs
      - .github/workflows/repair-multigrade-common-fallbacks.yml

permissions:
  contents: write

concurrency:
  group: repair-multigrade-common-fallbacks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Sync branch
        run: |
          set -euo pipefail
          git fetch origin "${GITHUB_REF_NAME}"
          git rebase "origin/${GITHUB_REF_NAME}"
      - name: Repair common category grade coverage
        run: node tools/repair_multigrade_common_fallbacks.mjs
      - name: Validate runtime syntax
        run: node tools/check_problem_app_runtime_parse.mjs
      - name: Commit repair
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add problem-app/index.html tools/install_vocab_safe_fallback_v1.mjs audit/VOCAB_MULTIGRADE_COMMON_FALLBACK_REPAIR.json audit/PROBLEM_APP_RUNTIME_PARSE_CHECK.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'fix: generalize common fallbacks across learned grades [skip ci]'
          branch="${GITHUB_REF_NAME}"
          for attempt in 1 2 3 4; do
            if git push origin "HEAD:${branch}"; then exit 0; fi
            git fetch origin "${branch}"
            git rebase "origin/${branch}"
            sleep 2
          done
          exit 1
