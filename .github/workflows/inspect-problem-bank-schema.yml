name: Inspect problem bank schema

on:
  push:
    branches:
      - fix-vocab-grammar-range-20260825
    paths:
      - tools/inspect_problem_bank_schema.mjs
      - .github/workflows/inspect-problem-bank-schema.yml

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Inspect schema
        run: node tools/inspect_problem_bank_schema.mjs
      - name: Commit result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add audit/PROBLEM_BANK_SCHEMA.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'diag: record problem bank schema [skip ci]'
          branch="${GITHUB_REF_NAME}"
          for attempt in 1 2 3; do
            git fetch origin "${branch}"
            if ! git rebase "origin/${branch}"; then git rebase --abort || true; exit 1; fi
            if git push origin "HEAD:${branch}"; then exit 0; fi
            sleep 2
          done
          exit 1
