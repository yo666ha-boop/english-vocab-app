name: Repair problem grammar chronology installer

on:
  push:
    branches:
      - fix-vocab-grammar-range-20260825
    paths:
      - .github/workflows/repair-problem-grammar-chronology-installer.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair brittle renderStageOptions anchor
        shell: python
        run: |
          from pathlib import Path
          p=Path('tools/install_problem_grammar_chronology.mjs')
          s=p.read_text()
          start=s.index('const renderRe = ')
          end_marker="html = html.replace(renderRe, block);"
          end=s.index(end_marker,start)+len(end_marker)
          replacement=r'''const renderStart = html.indexOf('function renderStageOptions');
if (renderStart < 0) throw new Error('renderStageOptions function not found');
let renderEnd = html.indexOf('\n}\n\nfunction renderTypeOptions', renderStart);
if (renderEnd < 0) renderEnd = html.indexOf('\r\n}\r\n\r\nfunction renderTypeOptions', renderStart);
if (renderEnd < 0) throw new Error('renderStageOptions end anchor not found');
renderEnd += html[renderEnd] === '\r' ? 3 : 2;
html = html.slice(0, renderStart) + block + html.slice(renderEnd);'''
          s=s[:start]+replacement+s[end:]
          p.write_text(s)
      - name: Verify installer source parses
        run: node --check tools/install_problem_grammar_chronology.mjs
      - name: Commit repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/install_problem_grammar_chronology.mjs
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'fix: make grammar chronology installer anchor resilient [skip ci]'
          branch="${GITHUB_REF_NAME}"
          git fetch origin "${branch}"
          git rebase "origin/${branch}"
          git push origin "HEAD:${branch}"
