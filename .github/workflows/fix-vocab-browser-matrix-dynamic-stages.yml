name: Fix vocab browser matrix dynamic stages

on:
  push:
    branches:
      - fix-vocab-grammar-range-20260825
    paths:
      - tools/fix_vocab_browser_matrix_dynamic_stages.mjs
      - .github/workflows/fix-vocab-browser-matrix-dynamic-stages.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Patch matrix to measure learned stages per section
        run: node tools/fix_vocab_browser_matrix_dynamic_stages.mjs
      - name: Commit matrix harness fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/problem-app-vocab-browser-matrix.yml
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'test: measure learned grammar stages dynamically [skip ci]'
          git restore --worktree .
          git clean -fd
          branch="${GITHUB_REF_NAME}"
          for attempt in 1 2 3 4; do
            git fetch origin "${branch}"
            if ! git rebase "origin/${branch}"; then git rebase --abort || true; exit 1; fi
            if git push origin "HEAD:${branch}"; then exit 0; fi
            sleep 2
          done
          exit 1
