name: Audit problem semantic review signals
on:
  workflow_dispatch:
  push:
    branches: [fix-problem-content-quality-20260828]
    paths:
      - 'tools/audit_problem_semantic_review_signals.mjs'
      - '.github/workflows/audit-problem-semantic-review-signals.yml'
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-problem-content-quality-20260828
      - run: git pull --ff-only origin fix-problem-content-quality-20260828
      - run: node --check tools/audit_problem_semantic_review_signals.mjs
      - name: Audit semantic review signals
        shell: bash
        run: |
          set +e
          node tools/audit_problem_semantic_review_signals.mjs
          code=$?
          set -e
          echo "audit_exit=$code"
      - name: Commit evidence
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add audit/PROBLEM_APP_SEMANTIC_REVIEW_SIGNALS.json
          if git diff --cached --quiet; then echo 'No changes'; else git commit -m 'audit: record semantic review signals [skip ci]' && git push; fi
