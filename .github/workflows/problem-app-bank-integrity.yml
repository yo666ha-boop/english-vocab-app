name: Problem app bank integrity

# 2026-08-26: rerun final candidate after multigrade common fallback repair.
on:
  push:
    branches:
      - fix-vocab-grammar-range-20260825
    paths:
      - tools/audit_problem_app_bank_integrity.mjs
      - .github/workflows/problem-app-bank-integrity.yml
      - problem-app/index.html

permissions:
  contents: write

concurrency:
  group: problem-app-bank-integrity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Sync branch
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "${GITHUB_REF_NAME}"
          git rebase "origin/${GITHUB_REF_NAME}"
      - name: Audit bank integrity
        run: node tools/audit_problem_app_bank_integrity.mjs
      - name: Commit audit result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add audit/PROBLEM_APP_BANK_INTEGRITY.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'audit: record problem bank integrity [skip ci]'
          branch="${GITHUB_REF_NAME}"
          for attempt in 1 2 3 4; do
            if git push origin "HEAD:${branch}"; then exit 0; fi
            git fetch origin "${branch}"
            git rebase "origin/${branch}"
            sleep 2
          done
          exit 1
