name: Extract print history context

on:
  workflow_dispatch:
  push:
    branches:
      - feature-print-history-20260829
    paths:
      - tools/extract_print_history_context.mjs
      - .github/workflows/extract-print-history-context.yml

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Extract context
        run: node tools/extract_print_history_context.mjs
      - name: Commit context evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add audit/PROBLEM_APP_PRINT_HISTORY_CONTEXT.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'diag: record print-history source context [skip ci]'
          branch="${GITHUB_REF_NAME}"
          for attempt in 1 2 3 4; do
            git fetch origin "${branch}"
            if ! git rebase "origin/${branch}"; then git rebase --abort || true; exit 1; fi
            if git push origin "HEAD:${branch}"; then exit 0; fi
            sleep 2
          done
          exit 1
