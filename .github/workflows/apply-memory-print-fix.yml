name: Apply memory print fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-memory-print-fix.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - name: Apply patch
        id: patch
        shell: bash
        run: |
          set +e
          node tools/fix_memory_print.mjs > /tmp/memory-fix.log 2>&1
          code=$?
          mkdir -p audit
          cp /tmp/memory-fix.log audit/MEMORY_PRINT_FIX_RUN.txt
          echo "exit_code=$code" >> audit/MEMORY_PRINT_FIX_RUN.txt
          cat audit/MEMORY_PRINT_FIX_RUN.txt
          exit $code
      - name: Audit unchanged vocabulary data
        run: |
          node tools/extract_vocab_data.mjs
          python3 tools/audit_vocab_structure.py
          node tools/diagnose_exam_pos.mjs
      - name: Commit fixed index
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --rebase --autostash origin main
          git add index.html audit/MEMORY_PRINT_FIX_RUN.txt audit/EXAM_POS_DIAGNOSTIC.json audit/VOCAB_EMBEDDED_DATA_SUMMARY.json audit/VOCAB_EMBEDDED_DATA_SUMMARY.txt audit/VOCAB_SECONDARY_AUDIT.json audit/VOCAB_SECONDARY_AUDIT.txt
          git diff --cached --quiet && exit 0
          git commit -m 'fix: prevent memory print freeze and paginate output'
          git push origin HEAD:main
