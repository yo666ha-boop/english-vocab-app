name: Publish Mikami English Problem App

on:
  push:
    branches: [mikami-canonical-repair]
    paths:
      - '.github/workflows/publish-mikami-problem-app.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mikami-canonical-repair
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Fetch verified canonical source
        shell: bash
        run: |
          set -euo pipefail
          SRC='https://mikami-juku-english-problem-69n8lrrgx-yo666ha-7357s-projects.vercel.app/'
          curl --compressed -fL --retry 3 --connect-timeout 20 --max-time 180 "$SRC" -o /tmp/mikami-canonical.html
          test "$(wc -c < /tmp/mikami-canonical.html)" -eq 4035500
          echo '03b185974127709fa76ceac357f374d6fea99969833fa75266d3dbfa03dda432  /tmp/mikami-canonical.html' | sha256sum -c -

      - name: Build final V4 + My GPT handoff app
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release/public-problem-app
          OUT='release/public-problem-app/index.html'
          node tools/run_mikami_pipeline_v4_answer_gpt.mjs /tmp/mikami-canonical.html "$OUT"
          test -s "$OUT"
          echo 'c9ac67b8063efff248fd2b4913503ef712ad268e0a475d4c541bc12fc024c83f  release/public-problem-app/index.html' | sha256sum -c -
          grep -q '答案分析My GPTを開く' "$OUT"
          grep -q '旧方式（予備）' "$OUT"
          if grep -q 'be820c3e4d5c26773d642f1c055fea33f2796d71b6fca16f4e1edf5efc6f9213' "$OUT"; then
            echo 'private Knowledge hash leak'
            exit 1
          fi
          {
            echo 'STATUS=PASS'
            echo 'SOURCE_SHA256=03b185974127709fa76ceac357f374d6fea99969833fa75266d3dbfa03dda432'
            echo 'UNIFIED_HTML_SHA256=c9ac67b8063efff248fd2b4913503ef712ad268e0a475d4c541bc12fc024c83f'
            echo 'QUESTION_COUNT=10513'
            echo 'ENGLISH_QUESTION_COUNT=10511'
            echo 'MY_GPT_PRIMARY_UI=true'
            echo 'PRIVATE_KNOWLEDGE_EMBEDDED=false'
          } > release/public-problem-app/status.txt

      - name: Commit public app artifact to repair branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add release/public-problem-app/index.html release/public-problem-app/status.txt
          git commit -m 'publish final English problem app artifact' || true
          git pull --rebase origin mikami-canonical-repair || true
          for i in 1 2 3; do
            if git push origin HEAD:mikami-canonical-repair; then exit 0; fi
            git pull --rebase origin mikami-canonical-repair
            sleep 2
          done
          exit 1
