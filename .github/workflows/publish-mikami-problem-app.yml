name: Publish Mikami English Problem App

on:
  push:
    branches: [mikami-canonical-repair]
    paths:
      - '.github/workflows/publish-mikami-problem-app.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v4
        with:
          ref: mikami-canonical-repair
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Recover exact canonical HTML from protected problem-app preview
        shell: bash
        run: |
          set -euo pipefail
          SRC='https://mikami-juku-english-problem-69n8lrrgx-yo666ha-7357s-projects.vercel.app/?_vercel_share=8L0M4lm0rWKgiqf2vaD0iaxa4Q14nn6T'
          rm -f /tmp/vercel.cookies /tmp/mikami-canonical.html /tmp/recover.headers
          curl --compressed -fL \
            --retry 3 --retry-all-errors \
            --connect-timeout 20 --max-time 180 \
            -c /tmp/vercel.cookies -b /tmp/vercel.cookies \
            -D /tmp/recover.headers \
            "$SRC" -o /tmp/mikami-canonical.html

          BYTES=$(wc -c < /tmp/mikami-canonical.html)
          SHA=$(sha256sum /tmp/mikami-canonical.html | awk '{print $1}')
          echo "recovered_bytes=$BYTES"
          echo "recovered_sha256=$SHA"
          test "$BYTES" -eq 4035500
          test "$SHA" = '03b185974127709fa76ceac357f374d6fea99969833fa75266d3dbfa03dda432'
          grep -q 'id="qb-data"' /tmp/mikami-canonical.html
          grep -q '<title>みかみ塾 英語問題アプリ 安定版+写真分析レポート</title>' /tmp/mikami-canonical.html

      - name: Build exact V4 + My GPT handoff app
        shell: bash
        run: |
          set -euo pipefail
          OUT=/tmp/mikami-problem-app-index.html
          node tools/run_mikami_pipeline_v4_answer_gpt.mjs /tmp/mikami-canonical.html "$OUT"
          test -s "$OUT"
          test "$(sha256sum "$OUT" | awk '{print $1}')" = 'c9ac67b8063efff248fd2b4913503ef712ad268e0a475d4c541bc12fc024c83f'
          grep -q '答案分析My GPTを開く' "$OUT"
          grep -q '答案写真はMy GPTへ直接添付' "$OUT"
          grep -q 'id="legacyPhotoAnalysisFallback"' "$OUT"
          grep -q 'id="photoInput"' "$OUT"
          grep -q '"photo_attachment_location": "MY_GPT_ONLY"' "$OUT.answer-gpt-integration.audit.json"
          grep -q '"app_photo_analysis_primary": false' "$OUT.answer-gpt-integration.audit.json"
          grep -q '"app_photo_input_scope": "legacy_fallback_only"' "$OUT.answer-gpt-integration.audit.json"
          if grep -q 'mikami_english_question_bank_knowledge.jsonl' "$OUT"; then
            echo 'private Knowledge filename leak' >&2
            exit 1
          fi
          if grep -q 'be820c3e4d5c26773d642f1c055fea33f2796d71b6fca16f4e1edf5efc6f9213' "$OUT"; then
            echo 'private Knowledge hash leak' >&2
            exit 1
          fi

      - name: Publish only /problem-app/ to main and preserve vocab root
        shell: bash
        run: |
          set -euo pipefail
          OUT=/tmp/mikami-problem-app-index.html
          git fetch origin main
          git checkout -B main origin/main
          ROOT_BEFORE=$(sha256sum index.html | awk '{print $1}')
          mkdir -p problem-app
          cp "$OUT" problem-app/index.html
          ROOT_AFTER=$(sha256sum index.html | awk '{print $1}')
          test "$ROOT_BEFORE" = "$ROOT_AFTER"
          test "$(sha256sum problem-app/index.html | awk '{print $1}')" = 'c9ac67b8063efff248fd2b4913503ef712ad268e0a475d4c541bc12fc024c83f'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- problem-app/index.html
          CHANGED=$(git diff --cached --name-only)
          if [ -n "$CHANGED" ]; then
            test "$CHANGED" = 'problem-app/index.html'
            git commit -m 'publish English problem app at /problem-app/'
            git push origin main
          fi

      - name: Verify published source file on main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git show origin/main:problem-app/index.html > /tmp/published-problem-app.html
          test "$(sha256sum /tmp/published-problem-app.html | awk '{print $1}')" = 'c9ac67b8063efff248fd2b4913503ef712ad268e0a475d4c541bc12fc024c83f'
          grep -q '答案分析My GPTを開く' /tmp/published-problem-app.html
          grep -q '答案写真はMy GPTへ直接添付' /tmp/published-problem-app.html
          echo 'PUBLISHED_PROBLEM_APP_GIT_SOURCE=PASS'
