name: Test Mikami Unified V4 + Answer GPT Runner

on:
  push:
    branches:
      - mikami-canonical-repair
    paths:
      - 'tools/run_mikami_pipeline_v4_answer_gpt.mjs'
      - 'tools/patch_mikami_answer_gpt_handoff.mjs'
      - 'tools/patch_mikami_answer_gpt_handoff_v2.mjs'
      - 'tools/test_mikami_answer_gpt_photo_routing_contract.mjs'
      - '.github/workflows/finalize-mikami-canonical-drive.yml'
      - '.github/workflows/test-mikami-answer-gpt-unified-runner.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mikami-canonical-repair
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Syntax checks
        run: |
          node --check tools/patch_mikami_answer_gpt_handoff.mjs
          node --check tools/patch_mikami_answer_gpt_handoff_v2.mjs
          node --check tools/run_mikami_pipeline_v4_answer_gpt.mjs
          node --check tools/test_mikami_answer_gpt_photo_routing_contract.mjs

      - name: Handoff v2 patch regression
        run: node tools/patch_mikami_answer_gpt_handoff_v2.mjs --self-test

      - name: My GPT-only photo routing regression
        run: node tools/test_mikami_answer_gpt_photo_routing_contract.mjs

      - name: Existing V4 repair integration regression
        run: node tools/test_pipeline_v4_integration.mjs

      - name: Unified wiring and My GPT-only photo routing contract
        shell: bash
        run: |
          set -euo pipefail
          F='.github/workflows/finalize-mikami-canonical-drive.yml'
          R='tools/run_mikami_pipeline_v4_answer_gpt.mjs'
          T='tools/test_mikami_answer_gpt_photo_routing_contract.mjs'
          grep -q 'run_mikami_pipeline_v4_answer_gpt.mjs' "$F"
          grep -q 'みかみ塾英語問題アプリ_正本修正版_MyGPT連携_20260820.zip' "$F"
          grep -q 'qb_data_unchanged_after_handoff_patch' "$F"
          grep -q 'PRIVATE_KNOWLEDGE_EMBEDDED=false' "$F"
          grep -q 'QUESTION_BANK_CHANGED=false' "$F"
          grep -q 'patch_mikami_answer_gpt_handoff_v2.mjs' "$R"
          grep -q 'JSON.stringify(beforeQb) === JSON.stringify(afterQb)' "$R"
          grep -q 'audit_final_canonical.mjs' "$R"
          grep -q 'handoff_patch_version: 2' "$R"
          grep -q 'arbitrary_https_url_rejected: true' "$R"
          grep -q 'question_id_order_preserved: true' "$R"
          grep -q 'private_knowledge_embedded: false' "$R"
          grep -q "photo_attachment_location: 'MY_GPT_ONLY'" "$R"
          grep -q 'app_photo_analysis_primary: false' "$R"
          grep -q "app_photo_input_scope: 'legacy_fallback_only'" "$R"
          grep -q 'photoInputAt > fallbackAt' "$R"
          grep -q 'do not add a primary photo-upload route' "$R"
          grep -q "photo_attachment_location: 'MY_GPT_ONLY'" "$T"
          grep -q 'app_photo_analysis_primary: false' "$T"
          ! grep -q '1t51uacLDfzhv8gBsyi9H_czRnbGsuCaC' "$F"
          echo PASS_UNIFIED_ANSWER_GPT_WIRING_V2
          echo PASS_PHOTO_ATTACHMENT_LOCATION_MY_GPT_ONLY

      - name: Record durable PASS
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release/generated
          {
            echo 'STATUS=PASS'
            echo "SOURCE_SHA=$GITHUB_SHA"
            echo 'V4_REGRESSION=PASS'
            echo 'HANDOFF_PATCH_VERSION=2'
            echo 'HANDOFF_PATCH_SELF_TEST=PASS'
            echo 'CUSTOM_GPT_URL_HOST_GATE=PASS'
            echo 'CUSTOM_GPT_URL_G_PATH_GATE=PASS'
            echo 'ARBITRARY_HTTPS_URL_REJECTED=true'
            echo 'PHOTO_ROUTING_CONTRACT=PASS'
            echo 'UNIFIED_RUNNER_SYNTAX=PASS'
            echo 'FINALIZE_WIRING=PASS'
            echo 'QB_DATA_PRESERVATION_CHECK=ENFORCED'
            echo 'FINAL_CANONICAL_AUDIT=ENFORCED'
            echo 'PHOTO_ATTACHMENT_LOCATION=MY_GPT_ONLY'
            echo 'APP_PHOTO_ANALYSIS_PRIMARY=false'
            echo 'APP_PHOTO_INPUT_SCOPE=legacy_fallback_only'
            echo 'MY_GPT_DIRECT_PHOTO_ATTACHMENT=true'
            echo 'PRIVATE_KNOWLEDGE_EMBEDDED=false'
            echo 'REAL_CANONICAL_UNIFIED_RUN=PASS_PREVIOUSLY_VERIFIED_V1_ARTIFACT;V2_PUBLICATION_SEPARATE'
          } > release/generated/answer_gpt_unified_runner.status.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- release/generated/answer_gpt_unified_runner.status.txt
          git commit -m 'record unified V4 + My GPT v2 runner PASS' || exit 0
          git pull --rebase origin mikami-canonical-repair
          git push origin HEAD:mikami-canonical-repair
