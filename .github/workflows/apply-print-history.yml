name: Apply print history

on:
  workflow_dispatch:
  push:
    branches:
      - feature-print-history-20260829
    paths:
      - tools/add_print_history.mjs
      - .github/workflows/apply-print-history.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply print history with diagnostics
        shell: bash
        run: |
          set +e
          mkdir -p audit
          node tools/add_print_history.mjs > audit/PROBLEM_APP_PRINT_HISTORY_APPLY.log 2>&1
          code=$?
          echo "exit_code=${code}" >> audit/PROBLEM_APP_PRINT_HISTORY_APPLY.log
          cat audit/PROBLEM_APP_PRINT_HISTORY_APPLY.log
          echo "${code}" > audit/PROBLEM_APP_PRINT_HISTORY_APPLY_EXIT.txt
          exit 0
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: print-history-apply-diagnostics
          path: |
            audit/PROBLEM_APP_PRINT_HISTORY_APPLY.log
            audit/PROBLEM_APP_PRINT_HISTORY_APPLY_EXIT.txt
            audit/PROBLEM_APP_PRINT_HISTORY_IMPLEMENTATION.json
          if-no-files-found: warn
      - name: Commit implementation when patch succeeded
        shell: bash
        run: |
          set -euo pipefail
          code="$(cat audit/PROBLEM_APP_PRINT_HISTORY_APPLY_EXIT.txt)"
          if [[ "${code}" != "0" ]]; then
            echo "patch failed; diagnostic artifact uploaded"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add problem-app/index.html audit/PROBLEM_APP_PRINT_HISTORY_IMPLEMENTATION.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'feat: save and reopen exact printed problem sets [skip ci]'
          branch="${GITHUB_REF_NAME}"
          for attempt in 1 2 3 4; do
            git fetch origin "${branch}"
            if ! git rebase "origin/${branch}"; then git rebase --abort || true; exit 1; fi
            if git push origin "HEAD:${branch}"; then exit 0; fi
            sleep 2
          done
          exit 1
