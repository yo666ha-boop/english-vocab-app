name: Install problem grammar chronology

on:
  push:
    branches:
      - fix-vocab-grammar-range-20260825
    paths:
      - tools/install_problem_grammar_chronology.mjs
      - tools/repair_problem_grammar_chronology_installer_anchor.mjs
      - .github/workflows/install-problem-grammar-chronology.yml

permissions:
  contents: write

concurrency:
  group: install-problem-grammar-chronology
  cancel-in-progress: false

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Repair installer anchor if needed
        run: node tools/repair_problem_grammar_chronology_installer_anchor.mjs
      - name: Install chronology in problem app only
        run: node tools/install_problem_grammar_chronology.mjs
      - name: Parse runtime JavaScript
        run: node tools/check_problem_app_runtime_parse.mjs
      - name: Require protected root unchanged in worktree
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code -- index.html
      - name: Commit problem app chronology
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/install_problem_grammar_chronology.mjs problem-app/index.html audit/PROBLEM_APP_GRAMMAR_CHRONOLOGY_APPLY.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'feat: apply source-backed learned grammar chronology [skip ci]'
          git restore --worktree .
          git clean -fd
          branch="${GITHUB_REF_NAME}"
          for attempt in 1 2 3 4; do
            git fetch origin "${branch}"
            if ! git rebase "origin/${branch}"; then git rebase --abort || true; exit 1; fi
            if git push origin "HEAD:${branch}"; then exit 0; fi
            sleep 2
          done
          exit 1
