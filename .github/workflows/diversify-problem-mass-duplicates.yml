name: Diversify problem mass duplicates
on:
  push:
    branches: [fix-problem-content-quality-20260828]
    paths:
      - 'tools/diversify_problem_mass_duplicates.mjs'
      - 'audit/PROBLEM_APP_MASS_DUPLICATE_DIVERSIFY_TRIGGER.md'
permissions:
  contents: write
concurrency:
  group: diversify-problem-mass-duplicates-${{ github.ref }}
  cancel-in-progress: false
jobs:
  diversify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-problem-content-quality-20260828
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Diversify semantic mass duplicates
        run: node tools/diversify_problem_mass_duplicates.mjs
      - name: Content quality audit
        run: node tools/audit_problem_content_quality.mjs || true
      - name: Duplicate family summary
        run: node tools/summarize_problem_duplicate_families.mjs
      - name: Mass duplicate summary
        run: node tools/summarize_mass_duplicate_groups.mjs
      - name: Commit repairs and evidence
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add problem-app/index.html audit/PROBLEM_APP_MASS_DUPLICATE_DIVERSIFICATION.json audit/PROBLEM_APP_CONTENT_QUALITY.json audit/PROBLEM_APP_DUPLICATE_FAMILY_SUMMARY.json audit/PROBLEM_APP_MASS_DUPLICATE_GROUPS.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'fix: diversify mass duplicate problem families [skip ci]'
          git pull --rebase origin fix-problem-content-quality-20260828
          git push origin HEAD:fix-problem-content-quality-20260828
