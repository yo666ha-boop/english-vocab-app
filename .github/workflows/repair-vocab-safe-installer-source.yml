name: Repair vocab-safe installer source

on:
  push:
    branches:
      - fix-vocab-grammar-range-20260825
    paths:
      - tools/repair_vocab_safe_installer_source.mjs
      - .github/workflows/repair-vocab-safe-installer-source.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Repair installer source
        run: node tools/repair_vocab_safe_installer_source.mjs
      - name: Parse-check installer source
        run: node --check tools/install_vocab_safe_fallback_v1.mjs
      - name: Commit repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/install_vocab_safe_fallback_v1.mjs audit/VOCAB_SAFE_INSTALLER_SOURCE_REPAIR.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'fix: make vocab fallback installer reproducible [skip ci]'
          branch="${GITHUB_REF_NAME}"
          for attempt in 1 2 3 4; do
            git fetch origin "${branch}"
            if ! git rebase "origin/${branch}"; then git rebase --abort || true; exit 1; fi
            if git push origin "HEAD:${branch}"; then exit 0; fi
            sleep 2
          done
          exit 1
