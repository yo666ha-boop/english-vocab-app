name: Vocabulary Pages WebKit health check

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'tools/diagnose_exam_pos.mjs'
      - '.github/workflows/vocab-pages-health.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vocab-pages-health
  cancel-in-progress: true

jobs:
  webkit-smoke:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.55.0-noble
    env:
      PAGE_URL: https://yo666ha-boop.github.io/english-vocab-app/
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Diagnose exam POS data and filter code
        run: node tools/diagnose_exam_pos.mjs

      - name: Verify live Pages matches current main
        id: live
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_SHA="$(sha256sum index.html | awk '{print $1}')"
          LIVE_SHA=''
          HTTP_CODE=''
          for i in $(seq 1 36); do
            HTTP_CODE="$(curl -L -sS -o /tmp/live-index.html -w '%{http_code}' --connect-timeout 10 --max-time 30 "$PAGE_URL" || true)"
            if [ "$HTTP_CODE" = '200' ]; then
              LIVE_SHA="$(sha256sum /tmp/live-index.html | awk '{print $1}')"
              if [ "$LIVE_SHA" = "$EXPECTED_SHA" ]; then break; fi
            fi
            sleep 5
          done
          test "$HTTP_CODE" = '200'
          test "$LIVE_SHA" = "$EXPECTED_SHA"
          echo "index_sha256=$EXPECTED_SHA" >> "$GITHUB_OUTPUT"

      - name: Install matching Playwright package only
        run: npm install --no-save playwright@1.55.0

      - name: Run iPhone-sized WebKit interaction smoke
        env:
          INDEX_SHA: ${{ steps.live.outputs.index_sha256 }}
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const { webkit } = require('playwright');
          (async () => {
            const browser = await webkit.launch();
            const context = await browser.newContext({viewport:{width:390,height:844},deviceScaleFactor:3,isMobile:true,hasTouch:true,userAgent:'Mozilla/5.0 (iPhone; CPU iPhone OS 26_0 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/26.0 Mobile/15E148 Safari/604.1'});
            const page = await context.newPage();
            await page.goto(process.env.PAGE_URL,{waitUntil:'networkidle',timeout:60000});
            await page.locator('.title',{hasText:'英単語アプリ（統合版）'}).waitFor({timeout:15000});
            const tabs=page.locator('button.tab');
            if(await tabs.count()!==3)throw new Error('dataset tab count != 3');
            const labels=await tabs.allTextContents();
            if(JSON.stringify(labels)!==JSON.stringify(['教科書版','高校入試版','小学生版']))throw new Error('dataset tab labels mismatch: '+JSON.stringify(labels));
            await page.locator('#makeTestBtn').click();
            await page.waitForFunction(()=>document.querySelector('#testSummary')?.textContent?.includes('10問作成済み'),null,{timeout:15000});
            if(await page.locator('.test-card').count()!==10)throw new Error('test cards != 10');
            if(await page.locator('.ans.show').count()!==0)throw new Error('answers visible before toggle');
            await page.locator('#toggleAnswersBtn').click();
            if(await page.locator('.ans.show').count()!==10)throw new Error('answers not shown after toggle');
            await page.locator('button.tab[data-dataset="exam"]').click();
            if(!(await page.locator('button.tab[data-dataset="exam"]').getAttribute('class'))?.includes('active'))throw new Error('exam tab did not activate');
            await page.locator('button.tab[data-dataset="elementary"]').click();
            if(!(await page.locator('button.tab[data-dataset="elementary"]').getAttribute('class'))?.includes('active'))throw new Error('elementary tab did not activate');
            await page.locator('button.tab[data-dataset="textbook"]').click();
            if(!(await page.locator('button.tab[data-dataset="textbook"]').getAttribute('class'))?.includes('active'))throw new Error('textbook tab did not reactivate');
            const status={status:'pass',page_url:process.env.PAGE_URL,index_sha256:process.env.INDEX_SHA,engine:'Playwright WebKit',mobile_viewport:'390x844',checks:{page_loaded:true,title_visible:true,three_dataset_tabs:true,default_10_question_test_created:true,ten_test_cards_rendered:true,answer_toggle_works:true,exam_tab_switch_works:true,elementary_tab_switch_works:true,textbook_tab_switch_back_works:true},checked_at_utc:new Date().toISOString()};
            fs.mkdirSync('audit',{recursive:true});
            fs.writeFileSync('audit/PAGES_WEBKIT_SMOKE.json',JSON.stringify(status,null,2)+'\n');
            await page.screenshot({path:'audit/PAGES_WEBKIT_SMOKE.png'});
            await browser.close();
            console.log(JSON.stringify(status,null,2));
          })().catch(e=>{console.error(e);process.exit(1);});
          NODE

      - name: Commit verified health and POS diagnostics
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add audit/PAGES_WEBKIT_SMOKE.json audit/PAGES_WEBKIT_SMOKE.png audit/EXAM_POS_DIAGNOSTIC.json audit/EXAM_POS_UI_SNIPPETS.txt
          git diff --cached --quiet && exit 0
          git commit -m 'test: record vocabulary health and exam POS diagnostic'
          git pull --rebase origin main
          git push origin HEAD:main
