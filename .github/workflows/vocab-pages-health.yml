name: Vocabulary Pages WebKit health check

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'tools/diagnose_exam_pos.mjs'
      - '.github/workflows/vocab-pages-health.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vocab-pages-health
  cancel-in-progress: true

jobs:
  webkit-smoke:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.55.0-noble
    env:
      PAGE_URL: https://yo666ha-boop.github.io/english-vocab-app/
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Apply reviewed exam POS repair
        run: node tools/fix_exam_pos_filter.mjs

      - name: Run vocabulary audits
        run: |
          node tools/extract_vocab_data.mjs
          python3 tools/audit_vocab_structure.py
          node tools/diagnose_exam_pos.mjs

      - name: Commit repaired app before live verification
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html audit/EXAM_POS_FIX_RESULT.json audit/EXAM_POS_CLASSIFICATION.tsv audit/EXAM_POS_DIAGNOSTIC.json audit/EXAM_POS_UI_SNIPPETS.txt audit/EXAM_POS_NEEDS_REVIEW.tsv audit/VOCAB_EMBEDDED_DATA_SUMMARY.json audit/VOCAB_EMBEDDED_DATA_SUMMARY.txt audit/VOCAB_SECONDARY_AUDIT.json audit/VOCAB_SECONDARY_AUDIT.txt
          if ! git diff --cached --quiet; then
            git commit -m 'fix(vocab): enable exam POS filtering'
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Verify live Pages matches repaired main
        id: live
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_SHA="$(sha256sum index.html | awk '{print $1}')"
          LIVE_SHA=''
          HTTP_CODE=''
          for i in $(seq 1 60); do
            HTTP_CODE="$(curl -L -sS -o /tmp/live-index.html -w '%{http_code}' --connect-timeout 10 --max-time 30 "$PAGE_URL" || true)"
            if [ "$HTTP_CODE" = '200' ]; then
              LIVE_SHA="$(sha256sum /tmp/live-index.html | awk '{print $1}')"
              if [ "$LIVE_SHA" = "$EXPECTED_SHA" ]; then break; fi
            fi
            sleep 5
          done
          test "$HTTP_CODE" = '200'
          test "$LIVE_SHA" = "$EXPECTED_SHA"
          echo "index_sha256=$EXPECTED_SHA" >> "$GITHUB_OUTPUT"

      - name: Install matching Playwright package only
        run: npm install --no-save playwright@1.55.0

      - name: Run iPhone-sized WebKit interaction smoke including exam POS
        env:
          INDEX_SHA: ${{ steps.live.outputs.index_sha256 }}
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const { webkit } = require('playwright');
          (async () => {
            const browser = await webkit.launch();
            const context = await browser.newContext({viewport:{width:390,height:844},deviceScaleFactor:3,isMobile:true,hasTouch:true,userAgent:'Mozilla/5.0 (iPhone; CPU iPhone OS 26_0 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/26.0 Mobile/15E148 Safari/604.1'});
            const page = await context.newPage();
            await page.goto(process.env.PAGE_URL,{waitUntil:'networkidle',timeout:60000});
            await page.locator('.title',{hasText:'英単語アプリ（統合版）'}).waitFor({timeout:15000});
            const tabs=page.locator('button.tab');
            if(await tabs.count()!==3) throw new Error('dataset tab count != 3');
            if(JSON.stringify(await tabs.allTextContents())!==JSON.stringify(['教科書版','高校入試版','小学生版'])) throw new Error('dataset tab labels mismatch');

            await page.locator('button.tab[data-dataset="exam"]').click();
            const posInputs=page.locator('#examPosBox input[type="checkbox"]');
            if(await posInputs.count()<5) throw new Error('exam POS options missing');
            const noun=page.locator('#examPosBox input[value="名詞"]');
            if(await noun.count()!==1) throw new Error('名詞 POS option missing');
            await noun.check();
            await page.waitForTimeout(100);
            const rows=page.locator('#listTable tbody tr');
            if(await rows.count()===0) throw new Error('noun filter produced zero rows');
            const posCells=page.locator('#listTable tbody tr td:nth-child(3)');
            const values=await posCells.allTextContents();
            if(values.some(v=>v.trim()!=='名詞')) throw new Error('non-noun row leaked through POS filter: '+JSON.stringify(values.slice(0,20)));
            if(!(await page.locator('#theadRow').textContent()).includes('品詞')) throw new Error('exam list POS column missing');
            await page.locator('#makeTestBtn').click();
            await page.waitForFunction(()=>document.querySelector('#testSummary')?.textContent?.includes('10問作成済み'),null,{timeout:15000});
            if(await page.locator('.test-card').count()!==10) throw new Error('exam noun test cards != 10');
            await page.locator('#toggleAnswersBtn').click();
            if(await page.locator('.ans.show').count()!==10) throw new Error('exam answers toggle failed');

            await page.locator('button.tab[data-dataset="elementary"]').click();
            if(!(await page.locator('button.tab[data-dataset="elementary"]').getAttribute('class'))?.includes('active')) throw new Error('elementary tab did not activate');
            await page.locator('button.tab[data-dataset="textbook"]').click();
            if(!(await page.locator('button.tab[data-dataset="textbook"]').getAttribute('class'))?.includes('active')) throw new Error('textbook tab did not reactivate');

            const status={status:'pass',page_url:process.env.PAGE_URL,index_sha256:process.env.INDEX_SHA,engine:'Playwright WebKit',mobile_viewport:'390x844',checks:{page_loaded:true,three_dataset_tabs:true,exam_pos_filter_present:true,exam_noun_filter_nonempty:true,exam_noun_filter_exclusive:true,exam_pos_column_visible:true,exam_filtered_10_question_test_created:true,answer_toggle_works:true,elementary_tab_switch_works:true,textbook_tab_switch_back_works:true},checked_at_utc:new Date().toISOString()};
            fs.mkdirSync('audit',{recursive:true});
            fs.writeFileSync('audit/PAGES_WEBKIT_SMOKE.json',JSON.stringify(status,null,2)+'\n');
            await page.screenshot({path:'audit/PAGES_WEBKIT_SMOKE.png'});
            await browser.close();
            console.log(JSON.stringify(status,null,2));
          })().catch(e=>{console.error(e);process.exit(1);});
          NODE

      - name: Commit verified live health
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --rebase origin main
          git add audit/PAGES_WEBKIT_SMOKE.json audit/PAGES_WEBKIT_SMOKE.png
          git diff --cached --quiet && exit 0
          git commit -m 'test: record live exam POS WebKit pass'
          git push origin HEAD:main
