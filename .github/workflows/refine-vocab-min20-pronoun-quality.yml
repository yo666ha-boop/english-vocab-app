name: Refine vocab min20 pronoun quality
on:
  push:
    branches: [fix-vocab-grammar-range-20260825]
    paths:
      - tools/refine_vocab_min20_pronoun_quality.mjs
      - .github/workflows/refine-vocab-min20-pronoun-quality.yml
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Sync branch
        run: git fetch origin "${GITHUB_REF_NAME}" && git rebase "origin/${GITHUB_REF_NAME}"
      - name: Refine pronoun fallback wording
        run: node tools/refine_vocab_min20_pronoun_quality.mjs
      - name: Validate runtime syntax
        run: node tools/check_problem_app_runtime_parse.mjs
      - name: Commit repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add problem-app/index.html tools/install_vocab_safe_fallback_v1.mjs tools/extend_vocab_safe_fallback_min20.mjs audit/PROBLEM_APP_RUNTIME_PARSE_CHECK.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'fix: refine grade2 pronoun fallback quality [skip ci]'
          branch="${GITHUB_REF_NAME}"
          for attempt in 1 2 3 4; do
            if git push origin "HEAD:${branch}"; then exit 0; fi
            git fetch origin "${branch}" && git rebase "origin/${branch}"
            sleep 2
          done
          exit 1
