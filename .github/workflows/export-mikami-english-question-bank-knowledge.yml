name: Export Mikami English question bank knowledge
on:
  push:
    branches: [fix-problem-content-quality-20260828]
    paths:
      - 'tools/export_mikami_english_question_bank_knowledge.mjs'
      - '.github/workflows/export-mikami-english-question-bank-knowledge.yml'
permissions:
  contents: write
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-problem-content-quality-20260828
      - run: git pull --ff-only origin fix-problem-content-quality-20260828
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate and validate Knowledge JSONL
        run: node tools/export_mikami_english_question_bank_knowledge.mjs
      - name: Commit Knowledge and manifest
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add mygpt/01_mikami_english_question_bank_knowledge.jsonl audit/MIKAMI_ENGLISH_QUESTION_BANK_KNOWLEDGE_MANIFEST.json
          if git diff --cached --quiet; then echo 'No changes'; else git commit -m 'build: regenerate My GPT knowledge from final 10511-question bank [skip ci]' && git push; fi
