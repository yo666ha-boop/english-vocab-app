name: Audit problem vocab minimum supply

on:
  push:
    branches:
      - fix-vocab-grammar-range-20260825
    paths:
      - tools/audit_problem_vocab_minimum_supply.mjs
      - .github/workflows/audit-problem-vocab-minimum-supply.yml

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-vocab-grammar-range-20260825
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Sync branch
        run: |
          git fetch origin fix-vocab-grammar-range-20260825
          git reset --hard origin/fix-vocab-grammar-range-20260825
      - name: Audit minimum learned grammar supply
        run: node tools/audit_problem_vocab_minimum_supply.mjs
      - name: Commit audit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add audit/PROBLEM_APP_VOCAB_MINIMUM_SUPPLY.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'audit: record learned grammar minimum supply [skip ci]'
          git pull --rebase origin fix-vocab-grammar-range-20260825
          git push
