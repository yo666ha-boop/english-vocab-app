name: Mikami Canonical Repair V3 Check
on:
  push:
    branches: [mikami-canonical-repair]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  check-v3:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check
        run: |
          node --check tools/fix_mikami_canonical.mjs
          node --check tools/repair_targeted_patterns_v3.mjs
          node --check tools/repair_m2_infinitive_bank_v4.mjs
          node --check tools/repair_infinitive_v3.mjs
          node --check tools/repair_present_perfect_v3.mjs
          node --check tools/repair_reading_v3.mjs
          node --check tools/repair_m3_word_order_v4.mjs
          node --check tools/repair_m3_infinitive2_v4.mjs
          node --check tools/repair_m3_review.mjs
          node --check tools/normalize_question_subject_case.mjs
          node --check tools/migrate_vocab_coordinates_v7.mjs
          node --check tools/apply_mikami_runtime_gates.mjs
          node --check tools/run_mikami_pipeline_v3.mjs
          node --check tools/test_targeted_patterns_v3.mjs
          node --check tools/test_m2_infinitive_bank_v4.mjs
          node --check tools/test_infinitive_v3.mjs
          node --check tools/test_present_perfect_v3.mjs
          node --check tools/test_reading_v3.mjs
          node --check tools/test_m3_word_order_v4.mjs
          node --check tools/test_m3_infinitive2_v4.mjs
          node --check tools/test_m3_review_v2.mjs
          node --check tools/test_vocab_coordinate_migration_v7.mjs
          node --check tools/test_pipeline_v3_integration.mjs
      - name: Targeted generated-family V3 regression
        run: node tools/test_targeted_patterns_v3.mjs
      - name: M2 infinitive bank V4 regression
        run: node tools/test_m2_infinitive_bank_v4.mjs
      - name: Infinitive V3 regression
        run: node tools/test_infinitive_v3.mjs
      - name: Present-perfect V3 regression
        run: node tools/test_present_perfect_v3.mjs
      - name: Reading V3 regression
        run: node tools/test_reading_v3.mjs
      - name: M3 word-order V4 regression
        run: node tools/test_m3_word_order_v4.mjs
      - name: M3 infinitive II V4 regression
        run: node tools/test_m3_infinitive2_v4.mjs
      - name: M3 regression
        run: node tools/test_m3_review_v2.mjs
      - name: V7 vocabulary coordinate migration regression
        run: node tools/test_vocab_coordinate_migration_v7.mjs
      - name: Full V3 pipeline integration
        run: node tools/test_pipeline_v3_integration.mjs
      - name: Safety stop against unrelated app
        run: |
          if node tools/run_mikami_pipeline_v3.mjs index.html /tmp/not-canonical.html 2>/tmp/v3.err; then
            echo 'ERROR: V3 pipeline accepted unrelated index.html'
            exit 1
          fi
          grep -q 'NOT CANONICAL' /tmp/v3.err
      - name: Build repair bundle
        run: |
          mkdir -p dist/mikami-canonical-repair/tools dist/mikami-canonical-repair/data dist/mikami-canonical-repair/release
          cp tools/*.mjs dist/mikami-canonical-repair/tools/
          cp data/v7_app_sections.json data/old_section_to_v7_rules.json dist/mikami-canonical-repair/data/
          cp release/FINALIZE_正本.bat release/README_FINALIZE.txt dist/mikami-canonical-repair/
      - name: Upload repair bundle
        uses: actions/upload-artifact@v4
        with:
          name: mikami-canonical-repair-bundle-20260818
          path: dist/mikami-canonical-repair
          if-no-files-found: error
