name: Mikami Canonical Repair V3 Check
on:
  push:
    branches: [mikami-canonical-repair]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  check-v3:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check
        run: |
          node --check tools/fix_mikami_canonical.mjs
          node --check tools/repair_targeted_patterns_v3.mjs
          node --check tools/repair_infinitive_v3.mjs
          node --check tools/repair_present_perfect_v3.mjs
          node --check tools/repair_reading_v3.mjs
          node --check tools/repair_m3_review.mjs
          node --check tools/normalize_question_subject_case.mjs
          node --check tools/apply_mikami_runtime_gates.mjs
          node --check tools/run_mikami_pipeline_v3.mjs
          node --check tools/test_targeted_patterns_v3.mjs
          node --check tools/test_infinitive_v3.mjs
          node --check tools/test_present_perfect_v3.mjs
          node --check tools/test_reading_v3.mjs
          node --check tools/test_m3_review_v2.mjs
          node --check tools/test_pipeline_v3_integration.mjs
      - name: Targeted generated-family V3 regression
        run: node tools/test_targeted_patterns_v3.mjs
      - name: Infinitive V3 regression
        run: node tools/test_infinitive_v3.mjs
      - name: Present-perfect V3 regression
        run: node tools/test_present_perfect_v3.mjs
      - name: Reading V3 regression
        run: node tools/test_reading_v3.mjs
      - name: M3 regression
        run: node tools/test_m3_review_v2.mjs
      - name: Full V3 pipeline integration
        run: node tools/test_pipeline_v3_integration.mjs
      - name: Safety stop against unrelated app
        run: |
          if node tools/run_mikami_pipeline_v3.mjs index.html /tmp/not-canonical.html 2>/tmp/v3.err; then
            echo 'ERROR: V3 pipeline accepted unrelated index.html'
            exit 1
          fi
          grep -q 'NOT CANONICAL' /tmp/v3.err
      - name: Download canonical-family Drive source
        run: |
          set -euo pipefail
          URL='https://drive.usercontent.google.com/download?id=1WuYC-xX6_2zfawSr6l_7IwpIvrMfNaRo&export=download&confirm=t'
          curl -L --fail --retry 2 "$URL" -o /tmp/source.html
          echo "bytes=$(wc -c </tmp/source.html)"
          sha256sum /tmp/source.html | tee /tmp/source.sha256.txt
          test "$(wc -c </tmp/source.html)" -eq 4037995
      - name: Verify source identity markers
        run: |
          set -euo pipefail
          grep -Fq '<title>みかみ塾 英語問題アプリ 安定版+写真分析レポート</title>' /tmp/source.html
          grep -Fq 'mikamijuku_app_stableplus_v2' /tmp/source.html
          grep -Fq 'id="qb-data"' /tmp/source.html
          grep -Fq 'id="meta-data"' /tmp/source.html
          grep -Fq 'R1-PRON-' /tmp/source.html
          grep -Fq 'GEN-PRS-' /tmp/source.html
          grep -Fq 'M2-GER2-' /tmp/source.html
          grep -Fq 'M2-COMP2-' /tmp/source.html
          grep -Fq 'M2X-INF-' /tmp/source.html
          grep -Fq 'M2-RD2-' /tmp/source.html
          grep -Fq 'M3N-02400' /tmp/source.html
          grep -Fq 'buildRecoveryPrompt' /tmp/source.html
          grep -Fq 'currentQuestionIds' /tmp/source.html
          grep -Fq 'aiClosingSummary' /tmp/source.html
      - name: Apply V3 to real source
        run: |
          node tools/run_mikami_pipeline_v3.mjs /tmp/source.html 14b01a93-de5d-4c95-a655-932d2f3f2513_V3_repaired.html
      - name: Preservation and gate audit
        run: |
          set -euo pipefail
          OUT='14b01a93-de5d-4c95-a655-932d2f3f2513_V3_repaired.html'
          grep -Fq '<title>みかみ塾 英語問題アプリ 安定版+写真分析レポート</title>' "$OUT"
          grep -Fq 'mikamijuku_app_stableplus_v2' "$OUT"
          grep -Fq 'buildRecoveryPrompt' "$OUT"
          grep -Fq 'currentQuestionIds' "$OUT"
          grep -Fq 'aiLearningSummary' "$OUT"
          grep -Fq 'aiClosingSummary' "$OUT"
          grep -Fq 'passesPrereqGrammar(item)' "$OUT"
          grep -Fq 'passesQualityGate(item)' "$OUT"
          grep -Fq 'minIdx <= 0' "$OUT"
          sha256sum "$OUT" > "${OUT}.sha256.txt"
      - name: Upload repaired HTML artifact
        uses: actions/upload-artifact@v4
        with:
          name: mikami-english-canonical-v3-repaired
          path: |
            14b01a93-de5d-4c95-a655-932d2f3f2513_V3_repaired.html
            14b01a93-de5d-4c95-a655-932d2f3f2513_V3_repaired.html.pipeline-v3.audit.json
            14b01a93-de5d-4c95-a655-932d2f3f2513_V3_repaired.html.sha256.txt
          if-no-files-found: error
