name: Apply vocab irregular plural lemmas

on:
  push:
    branches:
      - fix-vocab-grammar-range-20260825
    paths:
      - tools/extend_vocab_irregular_plural_lemmas.mjs
      - .github/workflows/apply-vocab-irregular-plural-lemmas.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-vocab-grammar-range-20260825
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Sync branch
        run: |
          git fetch origin fix-vocab-grammar-range-20260825
          git reset --hard origin/fix-vocab-grammar-range-20260825
      - name: Install irregular plural lemmas
        run: node tools/extend_vocab_irregular_plural_lemmas.mjs
      - name: Re-run morphology regression
        run: node tools/audit_vocab_morphology_regression.mjs
      - name: Commit repair and audit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/build_safe_problem_passmeta.mjs tools/audit_vocab_morphology_regression.mjs audit/PROBLEM_APP_VOCAB_IRREGULAR_PLURAL_LEMMA_REPAIR.json audit/PROBLEM_APP_VOCAB_MORPHOLOGY_REGRESSION.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'fix: support generic irregular plural lemmas [skip ci]'
          git pull --rebase origin fix-vocab-grammar-range-20260825
          git push
