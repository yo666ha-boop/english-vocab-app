name: Probe Mikami Deploy Secret Availability

on:
  push:
    branches: [mikami-canonical-repair]
    paths:
      - '.github/workflows/probe-mikami-deploy-secrets.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mikami-canonical-repair
      - name: Record secret availability only
        env:
          HAS_VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN != '' }}
          HAS_VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID != '' }}
          HAS_VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID != '' }}
          HAS_GOOGLE_DRIVE_TOKEN: ${{ secrets.GOOGLE_DRIVE_TOKEN != '' }}
          HAS_GOOGLE_ACCESS_TOKEN: ${{ secrets.GOOGLE_ACCESS_TOKEN != '' }}
          HAS_GDRIVE_TOKEN: ${{ secrets.GDRIVE_TOKEN != '' }}
          HAS_GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS != '' }}
          HAS_GOOGLE_DRIVE_CREDENTIALS: ${{ secrets.GOOGLE_DRIVE_CREDENTIALS != '' }}
          HAS_GDRIVE_CREDENTIALS: ${{ secrets.GDRIVE_CREDENTIALS != '' }}
        run: |
          set -euo pipefail
          mkdir -p release/generated
          {
            echo 'STATUS=PASS_BOOLEAN_ONLY'
            echo "RUN_ID=$GITHUB_RUN_ID"
            echo "HAS_VERCEL_TOKEN=$HAS_VERCEL_TOKEN"
            echo "HAS_VERCEL_ORG_ID=$HAS_VERCEL_ORG_ID"
            echo "HAS_VERCEL_PROJECT_ID=$HAS_VERCEL_PROJECT_ID"
            echo "HAS_GOOGLE_DRIVE_TOKEN=$HAS_GOOGLE_DRIVE_TOKEN"
            echo "HAS_GOOGLE_ACCESS_TOKEN=$HAS_GOOGLE_ACCESS_TOKEN"
            echo "HAS_GDRIVE_TOKEN=$HAS_GDRIVE_TOKEN"
            echo "HAS_GOOGLE_CREDENTIALS=$HAS_GOOGLE_CREDENTIALS"
            echo "HAS_GOOGLE_DRIVE_CREDENTIALS=$HAS_GOOGLE_DRIVE_CREDENTIALS"
            echo "HAS_GDRIVE_CREDENTIALS=$HAS_GDRIVE_CREDENTIALS"
            echo 'SECRET_VALUES_EXPOSED=false'
          } > release/generated/problem_app_deploy_secret_availability.status.txt
          cat release/generated/problem_app_deploy_secret_availability.status.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add release/generated/problem_app_deploy_secret_availability.status.txt
          git commit -m 'record problem app deploy secret availability' || exit 0
          git pull --rebase origin mikami-canonical-repair || true
          git push origin HEAD:mikami-canonical-repair
