<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>みかみ塾 英語問題アプリ</title>
<style>
:root{--bg:#f7f8fb;--card:#fff;--line:#d9e0ea;--text:#1f2937;--muted:#667085;--blue:#1d4ed8;--green:#15803d;--soft:#eef2ff}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;background:var(--bg);color:var(--text)}
header{padding:16px 18px;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:10}
h1{margin:0;font-size:22px}.sub{margin-top:6px;color:var(--muted);font-size:13px;line-height:1.7}
.wrap{max-width:1400px;margin:0 auto;padding:16px}
.tabs,.btns{display:flex;flex-wrap:wrap;gap:10px}
.tab,button{appearance:none;border:1px solid var(--line);background:#fff;border-radius:12px;padding:10px 14px;cursor:pointer;font-size:14px;color:var(--text)}
.tab.active{background:var(--soft);border-color:#c7d2fe;color:#3730a3;font-weight:700}
.primary{background:var(--blue);color:#fff;border-color:var(--blue)}
.layout{display:grid;grid-template-columns:420px 1fr;gap:16px;align-items:start;margin-top:16px}
@media (max-width:1100px){.layout{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:0 4px 18px rgba(0,0,0,.04)}
.screen{display:none}.screen.active{display:block}
.row2,.row3{display:grid;gap:12px}.row2{grid-template-columns:1fr 1fr}.row3{grid-template-columns:1fr 1fr 1fr}
@media (max-width:720px){.row2,.row3{grid-template-columns:1fr}}
label{display:block;font-weight:700;font-size:14px;margin-bottom:6px}
input[type=text],select,textarea{width:100%;border:1px solid var(--line);border-radius:12px;padding:11px 12px;background:#fff;font-size:14px}
.note{font-size:12px;color:var(--muted);line-height:1.7}
.status{margin-top:12px;padding:12px 14px;border-radius:14px;background:#eff6ff;border:1px solid #bfdbfe;color:#1d4ed8;line-height:1.8}
.status.good{background:#ecfdf5;border-color:#bbf7d0;color:#166534}
.checks{display:grid;grid-template-columns:1fr;gap:8px;max-height:260px;overflow:auto;border:1px solid var(--line);border-radius:14px;padding:10px;background:#fafcff}
.ck{display:flex;gap:8px;align-items:flex-start;font-size:14px}
.preview{min-height:240px}
.q{padding:10px 0;border-bottom:1px dashed var(--line)} .q:last-child{border-bottom:0}
.qnum{font-weight:800;color:var(--blue);margin-bottom:6px}
.ans{display:none;margin-top:8px;padding-top:8px;border-top:1px dashed var(--line);color:#166534}
.showAnswers .ans{display:block}
.tableWrap{overflow:auto;max-height:70vh;border:1px solid var(--line);border-radius:14px}
table{width:100%;border-collapse:collapse;background:#fff} th,td{padding:8px 10px;border-bottom:1px solid var(--line);font-size:13px;vertical-align:top;text-align:left} th{position:sticky;top:0;background:#f8fafc}
.hidden{display:none!important}

.twoCol{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:1100px){.twoCol{grid-template-columns:1fr}}
.resultBox{margin-top:12px;padding:14px;border:1px solid var(--line);border-radius:14px;background:#fff;line-height:1.8}
.pill{display:inline-block;padding:5px 10px;border-radius:999px;background:var(--soft);color:#3730a3;font-size:12px;margin:0 6px 6px 0}
img.previewImg{max-width:100%;max-height:320px;border-radius:12px;border:1px solid var(--line)}

@media print{header,.tabs,.builderOnly,.listControls{display:none!important} body{background:#fff} .card{border:none;box-shadow:none;padding:0}}
</style>
</head>
<body>
<header>
  <h1>みかみ塾 英語問題アプリ</h1>
  <div class="sub">問題作成・問題一覧・問題プリント印刷のためのアプリです。答案写真の分析、配布資料、面談資料、印刷用レポートは「みかみ塾 答案分析GPT」で作成します。</div>
  <div class="btns" style="margin-top:12px">
    <button id="exportJsonBtn">保存データを書き出す</button>
    <button id="importJsonBtn">保存データを読み込む</button>
    <input id="importJsonInput" type="file" accept=".json,application/json" class="hidden">
  </div>
  <div id="globalSaveStatus" class="sub" style="margin-top:8px">自動保存に加えて、必要な時だけ保存データを書き出せます。</div>
</header>

<div class="wrap">
  <div class="tabs">
    <button class="tab active" data-screen="builder">問題作成</button>
    <button class="tab" data-screen="list">問題一覧</button>
  </div>

  <div id="screen-builder" class="screen active">
    <div class="layout">
      <div class="card">
        <div class="row2">
          <div><label>科目</label><select id="subjectSelect"><option>英語</option><option>数学</option></select></div>
          <div><label>学年</label><select id="gradeSelect"><option>中1</option><option>中2</option><option>中3</option></select></div>
        </div>
        <div class="row2" style="margin-top:12px">
          <div id="textbookWrap"><label>教科書</label><select id="textbookSelect"></select></div>
          <div id="sectionWrap"><label>単語はここまで</label><select id="sectionSelect"></select></div>
        </div>
        <div class="row3" style="margin-top:12px">
          <div><label>問題数</label><select id="questionCount"><option>5</option><option selected>10</option><option>15</option><option>20</option></select></div>
          <div><label>単語制限</label><select id="vocabMode"><option value="on" selected>使う</option><option value="off">使わない</option></select></div>
          <div><label>候補の選び方</label><select id="pickMode"><option value="random" selected>ランダム</option><option value="top">上から順</option></select></div>
        </div>
        <div class="note" style="margin-top:10px">意味: たとえば「中3 / UNIT3まで」は、中1全部 + 中2全部 + 中3のそこまで の単語を使います。</div>
        <div style="margin-top:14px"><label>習った文法範囲</label><div id="stageArea" class="checks"></div></div>
        <div style="margin-top:14px"><label>出したい問題タイプ</label><div id="typeArea" class="checks"></div></div>
        <div class="btns builderOnly" style="margin-top:14px">
          <button id="generateBtn" class="primary">問題を作成</button>
          <button id="toggleAnswersBtn">解答表示切替</button>
          <button id="printBtn">印刷</button>
          <button id="toListBtn">この条件で問題一覧へ</button>
        </div>
        <div id="builderStatus" class="status">準備中…</div>
      </div>
      <div class="card preview"><div id="questionPreview">まだ問題を作成していません。</div></div>
    </div>
  </div>

  <div id="screen-list" class="screen">
    <div class="card">
      <div class="row3 listControls">
        <div><label>科目</label><select id="listSubject"><option value="英語">英語</option><option value="数学">数学</option><option value="all">すべて</option></select></div>
        <div><label>学年</label><select id="listGrade"><option value="all">すべて</option><option>中1</option><option>中2</option><option>中3</option></select></div>
        <div><label>表示件数</label><select id="listLimit"><option>20</option><option selected>50</option><option>100</option><option>200</option></select></div>
      </div>
      <div class="row2 listControls" style="margin-top:12px">
        <div><label>キーワード</label><input id="listKeyword" type="text" placeholder="問題文 / 解答 / ID で検索"></div>
        <div><label>表示モード</label><select id="listVocabMode"><option value="same">問題作成の単語制限を使う</option><option value="off">単語制限を使わない</option></select></div>
      </div>
      <div class="btns listControls" style="margin-top:14px"><button id="refreshListBtn" class="primary">一覧を更新</button></div>
      <div id="listStatus" class="status">一覧を更新してください。</div>
      <div class="tableWrap" style="margin-top:12px">
        <table>
          <thead><tr><th>ID</th><th>科目</th><th>学年</th><th>親項目</th><th>タイプ</th><th>問題</th><th>解答</th></tr></thead>
          <tbody id="listBody"></tbody>
        </table>
      </div>
    </div>
  </div>

  
  
<script>
(() => {
'use strict';
const qb = JSON.parse(document.getElementById('qb-data').textContent);
const meta = JSON.parse(document.getElementById('meta-data').textContent);
const el = id => document.getElementById(id);

const subjectConfig = {
  '英語': {
    types: ['空所補充','並びかえ','英作文','変形','見分け','答え方','間違い直し','読解','選択','答えから質問文'],
    stagesByGrade: {
      '中1': ['英語の語順','be動詞（現在形）','一般動詞（現在形）','be動詞と一般動詞','疑問詞','can','人称代名詞','命令文','一般動詞（３単現）','現在進行形','be動詞（過去形）','一般動詞（過去形）','過去進行形','there is ～，look ～ の文','未来の文','接続詞'],
      '中2': ['英語の語順','be動詞（現在形）','一般動詞（現在形）','be動詞と一般動詞（現在形）','be動詞と一般動詞（過去形）','疑問詞','人称代名詞','命令文','進行形','there is ～ の文','未来の文','助動詞','接続詞','不定詞①','動名詞','文型①（look ～，give A B）','比較','文型②（call A B，make A B）','受動態','現在完了形（完了・経験）','現在完了形（継続），現在完了進行形','不定詞②'],
      '中3': ['英語の語順','be動詞と一般動詞（現在形）','be動詞と一般動詞（過去形）','疑問詞','人称代名詞','進行形','命令文，there is ～ の文','未来の文','助動詞','接続詞','不定詞①，動名詞','比較','文型','受動態','現在完了形（完了・経験）','現在完了形（継続），現在完了進行形','不定詞②','分詞と間接疑問文','関係代名詞','仮定法']
    },
    stageMap: {
      '中1': {'英語の語順':['並びかえ','英作文'],'be動詞（現在形）':['be動詞'],'一般動詞（現在形）':['一般動詞'],'be動詞と一般動詞':['区別'],'疑問詞':['疑問詞'],'can':['can'],'人称代名詞':['人称代名詞'],'命令文':['命令文'],'一般動詞（３単現）':['三単現'],'現在進行形':['現在進行形'],'be動詞（過去形）':['過去のbe動詞'],'一般動詞（過去形）':['一般動詞の過去形','不規則動詞','過去を表す語'],'過去進行形':['過去進行形'],'there is ～，look ～ の文':['there is ～・look ～ の文'],'未来の文':['未来の文'],'接続詞':['接続詞']},
      '中2': {'英語の語順':['並びかえ','英作文'],'be動詞（現在形）':['be動詞'],'一般動詞（現在形）':['一般動詞'],'be動詞と一般動詞（現在形）':['be動詞と一般動詞（現在形）'],'be動詞と一般動詞（過去形）':['be動詞と一般動詞（過去形）'],'疑問詞':['疑問詞'],'人称代名詞':['人称代名詞'],'命令文':['命令文'],'進行形':['進行形'],'there is ～ の文':['there is ～ の文'],'未来の文':['未来表現','未来の文'],'助動詞':['助動詞'],'接続詞':['接続詞'],'不定詞①':['不定詞①','不定詞'],'動名詞':['動名詞'],'文型①（look ～，give A B）':['文型①（look ～，give A B）'],'比較':['比較'],'文型②（call A B，make A B）':['文型②（call A B，make A B）'],'受動態':['受動態'],'現在完了形（完了・経験）':['現在完了形（完了・経験）'],'現在完了形（継続），現在完了進行形':['現在完了形（継続），現在完了進行形'],'不定詞②':['不定詞②']},
      '中3': {'英語の語順':['英語の語順'],'be動詞と一般動詞（現在形）':['be動詞と一般動詞（現在形）'],'be動詞と一般動詞（過去形）':['be動詞と一般動詞（過去形）'],'疑問詞':['疑問詞'],'人称代名詞':['人称代名詞'],'進行形':['進行形'],'命令文，there is ～ の文':['命令文，there is ～ の文'],'未来の文':['未来の文'],'助動詞':['助動詞'],'接続詞':['接続詞'],'不定詞①，動名詞':['不定詞①，動名詞'],'比較':['比較'],'文型':['文型'],'受動態':['受動態'],'現在完了形（完了・経験）':['現在完了形（完了・経験）'],'現在完了形（継続），現在完了進行形':['現在完了形（継続），現在完了進行形'],'不定詞②':['不定詞②'],'分詞と間接疑問文':['分詞と間接疑問文'],'関係代名詞':['関係代名詞'],'仮定法':['仮定法']}
    }
  },
  '数学': {
    types: ['計算','文章題','変形','グラフ'],
    stagesByGrade: {'中1':['正負の数','文字式・方程式','比例・反比例'],'中2':['文字式・方程式'],'中3':['文字式・方程式']},
    stageMap: {'中1':{'正負の数':['正負の数'],'文字式・方程式':['文字式・方程式'],'比例・反比例':['比例・反比例']},'中2':{'文字式・方程式':['文字式・方程式']},'中3':{'文字式・方程式':['文字式・方程式']}}
  }
};

let currentQuestions = [];
let showAnswers = false;
const STORAGE_KEY = 'mikamijuku_problem_app_v3';

function captureState() {
  return {
    subject: el('subjectSelect')?.value || '英語',
    grade: el('gradeSelect')?.value || '中1',
    textbook: el('textbookSelect')?.value || '',
    section: el('sectionSelect')?.value || '',
    questionCount: el('questionCount')?.value || '10',
    vocabMode: el('vocabMode')?.value || 'on',
    pickMode: el('pickMode')?.value || 'random',
    stages: selectedValues('input[data-stage]'),
    types: selectedValues('input[data-type]'),
    listSubject: el('listSubject')?.value || '英語',
    listGrade: el('listGrade')?.value || 'all',
    listLimit: el('listLimit')?.value || '50',
    listKeyword: el('listKeyword')?.value || '',
    listVocabMode: el('listVocabMode')?.value || 'same',
    currentQuestionIds: currentQuestions.map(q => q.id),
    showAnswers
  };
}

function saveState(silent = true) {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(captureState()));
    if (!silent && el('globalSaveStatus')) {
      el('globalSaveStatus').textContent = 'この端末に保存しました。';
    }
  } catch (e) {
    if (el('globalSaveStatus')) el('globalSaveStatus').textContent = '保存に失敗しました。';
  }
}

function restoreQuestionSetByIds(ids) {
  const map = new Map(qb.map(q => [q.id, q]));
  const restored = (ids || []).map(id => map.get(id)).filter(Boolean);
  if (restored.length) {
    currentQuestions = restored;
    el('questionPreview').classList.toggle('showAnswers', showAnswers);
    el('questionPreview').innerHTML = restored.map((q, i) => `
      <div class="q">
        <div class="qnum">Q${String(i+1).padStart(2,'0')}　${q.id}　/　${q.category}　/　${q.type}</div>
        <div>${q.q}</div>
        <div class="ans">答え: ${q.a}</div>
      </div>
    `).join('');
    el('builderStatus').textContent = '保存されていた問題セットを復元しました。';
    el('builderStatus').classList.add('good');
  }
}

function safeSetValue(id, value) {
  const node = el(id);
  if (!node || value == null) return;
  const has = Array.from(node.options || []).some(op => op.value === value || op.textContent === value);
  if (has) node.value = value;
}

function setCheckedValues(selector, values) {
  const set = new Set(values || []);
  document.querySelectorAll(selector).forEach(ch => {
    ch.checked = set.size ? set.has(ch.value) : true;
  });
}

function applyState(state) {
  if (!state) return;
  safeSetValue('subjectSelect', state.subject);
  safeSetValue('gradeSelect', state.grade);
  renderSectionOptions();
  renderStageOptions();
  renderTypeOptions();
  safeSetValue('textbookSelect', state.textbook);
  renderSectionOptions();
  safeSetValue('sectionSelect', state.section);
  safeSetValue('questionCount', state.questionCount);
  safeSetValue('vocabMode', state.vocabMode);
  safeSetValue('pickMode', state.pickMode);
  setCheckedValues('input[data-stage]', state.stages);
  setCheckedValues('input[data-type]', state.types);
  syncListSelectors();
  safeSetValue('listSubject', state.listSubject);
  safeSetValue('listGrade', state.listGrade);
  safeSetValue('listLimit', state.listLimit);
  safeSetValue('listVocabMode', state.listVocabMode);
  if (el('listKeyword')) el('listKeyword').value = state.listKeyword || '';
  showAnswers = !!state.showAnswers;
  restoreQuestionSetByIds(state.currentQuestionIds || []);
  updateBuilderStatus(baseFiltered());
}

function exportStateFile() {
  const blob = new Blob([JSON.stringify(captureState(), null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'mikamijuku_app_state_latest.json';
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 3000);
  if (el('globalSaveStatus')) el('globalSaveStatus').textContent = '保存データを書き出しました。';
}

function importStateFile(file) {
  const fr = new FileReader();
  fr.onload = () => {
    try {
      const state = JSON.parse(fr.result);
      applyState(state);
      saveState(true);
      if (el('globalSaveStatus')) el('globalSaveStatus').textContent = '保存データを読み込みました。';
    } catch (e) {
      if (el('globalSaveStatus')) el('globalSaveStatus').textContent = '保存データの読み込みに失敗しました。';
    }
  };
  fr.readAsText(file, 'utf-8');
}

const currentSubject = () => el('subjectSelect').value;
const currentGrade = () => el('gradeSelect').value;
const currentTextbook = () => el('textbookSelect').value;
const currentSectionIndex = () => Math.max(0, el('sectionSelect').selectedIndex);
const useVocabGate = () => el('vocabMode').value === 'on';

function renderTabs() {
  document.querySelectorAll('.tab').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
      document.querySelectorAll('.screen').forEach(x => x.classList.remove('active'));
      btn.classList.add('active');
      const target = document.getElementById('screen-' + btn.dataset.screen);
      if (target) target.classList.add('active');
    });
  });
}

function renderTextbookOptions() {
  el('textbookSelect').innerHTML = meta.textbooks.map(tb => `<option>${tb}</option>`).join('');
}

function renderSectionOptions() {
  const subject = currentSubject();
  const grade = currentGrade().replace('中','');
  if (subject !== '英語') {
    el('textbookWrap').classList.add('hidden');
    el('sectionWrap').classList.add('hidden');
    return;
  }
  el('textbookWrap').classList.remove('hidden');
  el('sectionWrap').classList.remove('hidden');
  const tb = currentTextbook() || meta.textbooks[0];
  const sections = ((meta.sections[tb] || {})[grade] || []);
  el('sectionSelect').innerHTML = sections.map(sec => `<option>${sec}</option>`).join('');
}

function renderStageOptions() {
  const stages = subjectConfig[currentSubject()].stagesByGrade[currentGrade()] || [];
  el('stageArea').innerHTML = stages.map(s => `<label class="ck"><input type="checkbox" data-stage value="${s}" checked> <span>${s}</span></label>`).join('');
}

function renderTypeOptions() {
  const types = subjectConfig[currentSubject()].types;
  el('typeArea').innerHTML = types.map(t => `<label class="ck"><input type="checkbox" data-type value="${t}" checked> <span>${t}</span></label>`).join('');
}

function selectedValues(selector) {
  return Array.from(document.querySelectorAll(selector + ':checked')).map(x => x.value);
}

function selectedCategories() {
  const stages = selectedValues('input[data-stage]');
  if (!stages.length) return [];
  const map = subjectConfig[currentSubject()].stageMap[currentGrade()] || {};
  const set = new Set();
  stages.forEach(stage => (map[stage] || [stage]).forEach(c => set.add(c)));
  return Array.from(set);
}

function passesVocab(item, overrideMode) {
  if (item.subject !== '英語') return true;
  const mode = overrideMode || (useVocabGate() ? 'on' : 'off');
  if (mode === 'off') return true;
  if (item.grade !== currentGrade()) return true;
  const rec = meta.passMeta[item.id] || {};
  const minIdx = rec[currentTextbook()];
  if (meta.vocabCoordinateVersion !== 'v7-2026-08-18-1based') return false;
  if (minIdx === -2) return true;
  if (!Number.isInteger(minIdx) || minIdx <= 0) return false;
  const selectedOrdinal = currentSectionIndex() + 1;
  return minIdx <= selectedOrdinal;
}

// ---- Mikami prerequisite grammar + runtime quality gates ----
function selectedStageCeiling() {
  if (currentSubject() !== '英語') return Number.MAX_SAFE_INTEGER;
  const stages = subjectConfig['英語'].stagesByGrade[currentGrade()] || [];
  const selected = selectedValues('input[data-stage]');
  if (!selected.length) return -1;
  return selected.reduce((max, s) => Math.max(max, stages.indexOf(s)), -1);
}

function stageIndexByNameContains(...needles) {
  const stages = subjectConfig['英語'].stagesByGrade[currentGrade()] || [];
  for (let i = 0; i < stages.length; i++) {
    const s = stages[i];
    if (needles.some(n => s.includes(n))) return i;
  }
  return -1;
}

function targetStageIndex(item) {
  if (item.subject !== '英語') return -1;
  const cfg = subjectConfig['英語'];
  const stages = cfg.stagesByGrade[item.grade] || [];
  const map = cfg.stageMap[item.grade] || {};
  for (let i = 0; i < stages.length; i++) {
    const cats = map[stages[i]] || [stages[i]];
    if (cats.includes(item.category)) return i;
  }
  return -1;
}

function requiredGrammarStageIndex(item) {
  if (item.subject !== '英語') return -1;
  const text = String(item.q || '') + ' ' + String(item.a || '');
  let req = Math.max(0, targetStageIndex(item));
  const bump = i => { if (i >= 0) req = Math.max(req, i); };

  // Detect only structures that can make an otherwise earlier problem depend on a later grammar unit.
  if (/\b(will|won't)\b|\b(am|is|are) going to\b/i.test(text)) bump(stageIndexByNameContains('未来'));
  if (/\b(was|were)\s+[A-Za-z]+ing\b/i.test(text)) bump(stageIndexByNameContains('過去進行'));
  if (/\b(am|is|are)\s+[A-Za-z]+ing\b/i.test(text)) bump(stageIndexByNameContains('進行形'));
  if (/\b(can|must|may|should)\b/i.test(text)) bump(stageIndexByNameContains('助動詞','can'));
  if (/\bto\s+(?:be|have|do|play|study|read|write|watch|visit|see|eat|drink|go|come|make|use|help|learn|practice|speak|listen|buy|call|join|take|work|live|want|need|try|start|finish)\b/i.test(text)) bump(stageIndexByNameContains('不定詞①','不定詞②','不定詞'));
  if (/\b(?:enjoy|enjoys|enjoyed|finish|finishes|finished|stop|stops|stopped)\s+[A-Za-z]+ing\b/i.test(text)) bump(stageIndexByNameContains('動名詞','不定詞①，動名詞'));
  if (/\b(?:than|as\s+\w+\s+as|more\s+\w+\s+than|most\s+\w+)\b/i.test(text)) bump(stageIndexByNameContains('比較'));
  if (/\b(am|is|are|was|were)\s+(?:made|used|written|spoken|known|called|played|studied|visited|built|seen|loved)\b/i.test(text)) bump(stageIndexByNameContains('受動態'));
  if (/\b(?:have|has)\s+(?:ever\s+|never\s+|already\s+|just\s+)?(?:been|visited|finished|lost|lived|studied|seen|done|written|read|known|used|played|gone|made|eaten|had)\b/i.test(text)) bump(stageIndexByNameContains('現在完了形'));
  if (/\b(?:have|has) been [A-Za-z]+ing\b/i.test(text)) bump(stageIndexByNameContains('現在完了形（継続）'));
  if (/\b(?:who|which|that)\s+(?:is|are|was|were|has|have|can|will|[A-Za-z]+s?)(?:\s|\?)/i.test(text) && /\b(?:boy|girl|man|woman|teacher|student|person|book|bag|picture|pen|flower|thing)\b/i.test(text)) bump(stageIndexByNameContains('関係代名詞'));
  if (/\bif\b[\s\S]*\bwould\b|\bI wish\b/i.test(text)) bump(stageIndexByNameContains('仮定法'));
  return req;
}

function passesPrereqGrammar(item) {
  if (item.subject !== '英語') return true;
  const ceiling = selectedStageCeiling();
  if (ceiling < 0) return false;
  const required = requiredGrammarStageIndex(item);
  return required < 0 || required <= ceiling;
}

function passesQualityGate(item) {
  if (!item || !String(item.q || '').trim() || !String(item.a || '').trim()) return false;
  if (item.subject !== '英語') return true;
  const q = String(item.q || '');
  const a = String(item.a || '');
  const both = q + ' ' + a;

  // Known invalid / non-unique generation families.
  if (/This is (?:he|she|we)\b/i.test(both)) return false;
  if (/\bthan He\b/.test(both)) return false;
  if (/\b(?:Mika|She) (?:love|begin|stop)\b/.test(both)) return false;
  if (/Do you have (?:visited|been|finished|lost|lived|studied|seen|done)/i.test(both)) return false;
  if (/Did You ne\b|Do You\b|Do They\b|Does She\b|Does He\b/.test(both)) return false;
  if (/否定文または疑問文/.test(q)) return false;
  if (/日本語で説明しなさい/.test(q) && /^[A-Za-z]/.test(a)) return false;
  if (/\(\s*she\s*\/\s*her\s*\/\s*her\s*\)/i.test(q)) return false;
  if (/\(\s*he\s*\/\s*him\s*\/\s*him\s*\)/i.test(q)) return false;
  if (String(item.id || '').startsWith('M2-INF2-')) {
    if (item.type === '空所補充' && /^to$/i.test(a) && /\bto\s*\(\s*\)\s*(?=[A-Za-z])/i.test(q)) return false;
    if (/^(?:He|She|Yuki|Mika|Takumi|Ken|Emi|Tom|The student|The teacher|This boy|This girl|My mother|My father|My brother|My sister|My friend) (?:want|need|like) to\b/i.test(a)) return false;
  }

  // Target-grammar evidence: do not let a mislabeled vocabulary-only item through.
  if (item.category === '動名詞' && !/[A-Za-z]+ing\b/.test(both)) return false;
  if (item.category === '比較' && !/\bthan\b|\bas\s+\w+\s+as\b|\bmost\b|\w+est\b/i.test(both)) return false;
  const infinitiveBlank = item.type === '空所補充' && /^to$/i.test(a) && /\(\s*\)\s*[A-Za-z]+\b/.test(q);
  if ((item.category === '不定詞' || item.category === '不定詞①' || item.category === '不定詞②') && !/\bto\s+[A-Za-z]+\b/i.test(both) && !infinitiveBlank) return false;
  if (String(item.category).startsWith('現在完了形') && !/\b(?:have|has)\b/i.test(both)) return false;
  if (item.category === '関係代名詞') {
    if (!/\b(?:who|which|that)\b/i.test(both)) return false;
    if (item.type === '空所補充' && /\(\s*\)/.test(q)) {
      if (!/who\s*\/\s*which/i.test(q)) return false;
      if (!/^(?:who|which)$/i.test(a)) return false;
    }
  }
  return true;
}

function baseFiltered(overrideMode) {
  const subj = currentSubject();
  const grade = currentGrade();
  const categories = selectedCategories();
  const types = selectedValues('input[data-type]');
  return qb.filter(item => {
    if (item.subject !== subj) return false;
    if (item.grade !== grade) return false;
    if (categories.length && !categories.includes(item.category)) return false;
    if (types.length && !types.includes(item.type)) return false;
    if (!passesVocab(item, overrideMode)) return false;
    if (!passesPrereqGrammar(item)) return false;
    if (!passesQualityGate(item)) return false;
    return true;
  });
}

function shuffle(arr) {
  const a = arr.slice();
  for (let i=a.length-1;i>0;i--) {
    const j = Math.floor(Math.random() * (i+1));
    const tmp = a[i]; a[i] = a[j]; a[j] = tmp;
  }
  return a;
}

function updateBuilderStatus(candidates) {
  const subj = currentSubject();
  const grade = currentGrade();
  const sameGradeCount = qb.filter(x => x.subject === subj && x.grade === grade).length;
  let msg = '全問題 ' + meta.counts.all + '件 / ' + grade + 'の' + subj + '元データ ' + sameGradeCount + '件 / この条件で使える候補 ' + candidates.length + '件';
  if (subj === '英語') {
    msg += ' / 教科書: ' + currentTextbook() + ' / 単語はここまで: ' + (el('sectionSelect').value || '未選択');
  }
  el('builderStatus').textContent = msg;
  el('builderStatus').classList.toggle('good', candidates.length > 0);
}

function renderQuestions() {
  const count = parseInt(el('questionCount').value, 10);
  const pickMode = el('pickMode').value;
  const candidates = baseFiltered();
  updateBuilderStatus(candidates);
  if (!candidates.length) {
    currentQuestions = [];
    el('questionPreview').innerHTML = 'この条件では問題が見つかりませんでした。単語制限を外すか、範囲や問題タイプを広げてください。';
    return;
  }
  const picked = (pickMode === 'random' ? shuffle(candidates) : candidates).slice(0, count);
  currentQuestions = picked;
  el('questionPreview').classList.toggle('showAnswers', showAnswers);
  el('questionPreview').innerHTML = picked.map((q, i) => `
    <div class="q">
      <div class="qnum">Q${String(i+1).padStart(2,'0')}　${q.id}　/　${q.category}　/　${q.type}</div>
      <div>${q.q}</div>
      <div class="ans">答え: ${q.a}</div>
    </div>
  `).join('');
}

function printQuestions() {
  if (!currentQuestions.length) return;
  const printHtml = `<!doctype html><html lang="ja"><head><meta charset="utf-8"><title>印刷</title><style>
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Yu Gothic",sans-serif;margin:16mm}
  .q{margin:0 0 10mm 0;page-break-inside:avoid}.n{font-weight:700;margin-bottom:3mm}.a{margin-top:3mm;color:#0f766e}
  </style></head><body>
  <h2>${currentGrade()} ${currentSubject()} 問題プリント</h2>
  <div>教科書: ${currentSubject()==='英語' ? currentTextbook() : '—'} / 単語はここまで: ${currentSubject()==='英語' ? (el('sectionSelect').value || '—') : '—'}</div><hr>
  ${currentQuestions.map((q, i) => `<div class="q"><div class="n">Q${i+1}　${q.id}</div><div>${q.q}</div>${showAnswers ? `<div class="a">答え: ${q.a}</div>` : ''}</div>`).join('')}
  <script>window.onload=()=>window.print()<\/script></body></html>`;
  const w = window.open('', '_blank');
  if (!w) return;
  w.document.open();
  w.document.write(printHtml);
  w.document.close();
}

function refreshList() {
  const subj = el('listSubject').value;
  const grade = el('listGrade').value;
  const limit = parseInt(el('listLimit').value, 10);
  const kw = el('listKeyword').value.trim().toLowerCase();
  const vocabMode = el('listVocabMode').value === 'off' ? 'off' : (useVocabGate() ? 'on' : 'off');
  let rows = qb.filter(item => {
    if (subj !== 'all' && item.subject !== subj) return false;
    if (grade !== 'all' && item.grade !== grade) return false;
    if (item.subject === '英語' && item.grade === currentGrade() && !passesVocab(item, vocabMode)) return false;
    if (kw) {
      const hay = (item.id + ' ' + item.category + ' ' + item.type + ' ' + item.q + ' ' + item.a).toLowerCase();
      if (!hay.includes(kw)) return false;
    }
    return true;
  });
  el('listStatus').textContent = '一覧 ' + rows.length + '件';
  el('listStatus').classList.toggle('good', rows.length > 0);
  rows = rows.slice(0, limit);
  el('listBody').innerHTML = rows.map(item => `
    <tr><td>${item.id}</td><td>${item.subject}</td><td>${item.grade}</td><td>${item.category}</td><td>${item.type}</td><td>${item.q}</td><td>${item.a}</td></tr>
  `).join('');
}

function syncListSelectors() {
  el('listSubject').value = currentSubject();
  el('listGrade').value = currentGrade();
}

function wireEvents() {
  renderTabs();
  el('subjectSelect').addEventListener('change', () => { renderSectionOptions(); renderStageOptions(); renderTypeOptions(); syncListSelectors(); updateBuilderStatus(baseFiltered()); });
  el('gradeSelect').addEventListener('change', () => { renderSectionOptions(); renderStageOptions(); renderTypeOptions(); syncListSelectors(); updateBuilderStatus(baseFiltered()); });
  el('textbookSelect').addEventListener('change', () => { renderSectionOptions(); updateBuilderStatus(baseFiltered()); });
  el('sectionSelect').addEventListener('change', () => updateBuilderStatus(baseFiltered()));
  el('vocabMode').addEventListener('change', () => updateBuilderStatus(baseFiltered()));
  document.addEventListener('change', evt => {
    if (evt.target.matches('input[data-stage], input[data-type]')) updateBuilderStatus(baseFiltered());
  });
  el('generateBtn').addEventListener('click', renderQuestions);
  el('toggleAnswersBtn').addEventListener('click', () => { showAnswers = !showAnswers; renderQuestions(); });
  el('printBtn').addEventListener('click', printQuestions);
  el('toListBtn').addEventListener('click', () => { document.querySelector('.tab[data-screen="list"]').click(); refreshList(); saveState(true); });
  el('refreshListBtn').addEventListener('click', () => { refreshList(); saveState(true); });
  const autoSave = () => saveState(true);
  document.addEventListener('change', evt => {
    if (evt.target.closest('select,input,textarea')) autoSave();
  });
  document.addEventListener('input', evt => {
    if (evt.target.closest('input[type=text], textarea')) autoSave();
  });
  if (el('exportJsonBtn')) el('exportJsonBtn').addEventListener('click', exportStateFile);
  if (el('importJsonBtn')) el('importJsonBtn').addEventListener('click', () => el('importJsonInput').click());
  if (el('importJsonInput')) el('importJsonInput').addEventListener('change', evt => {
    const file = evt.target.files && evt.target.files[0];
    if (file) importStateFile(file);
    evt.target.value = '';
  });
}


function esc(s){ return String(s ?? '').replace(/[&<>"]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m])); }

renderTextbookOptions();
renderSectionOptions();
renderStageOptions();
renderTypeOptions();
syncListSelectors();
wireEvents();
try {
  const saved = localStorage.getItem(STORAGE_KEY);
  if (saved) applyState(JSON.parse(saved));
} catch (e) {}
updateBuilderStatus(baseFiltered());
})();
</script>
